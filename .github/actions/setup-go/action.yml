name: Set up Go
description: Set up Go using the repository's shared, pinned GitHub action.

inputs:
  go-version-file:
    description: Path to the go.mod or go.work file selecting the Go runtime.
    required: true
  cache:
    description: Cache Go dependencies and build outputs.
    required: false
    default: 'true'
  cache-dependency-path:
    description: Dependency file paths or globs used to calculate the cache key.
    required: false

runs:
  using: composite
  steps:
    # Let the caller decide whether setup should run after an earlier failure.
    - name: Set up Go
      if: ${{ always() }}
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
