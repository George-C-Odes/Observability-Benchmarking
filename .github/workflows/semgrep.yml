name: Semgrep

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly full scan picks up new registry rules on unchanged code.
    - cron: '11 7 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    env:
      # Fork and Dependabot PRs receive no repository secrets.
      SEMGREP_ENABLED: ${{ secrets.SEMGREP_APP_TOKEN != '' }}
    steps:
      - name: Check SEMGREP_APP_TOKEN secret
        if: env.SEMGREP_ENABLED != 'true'
        run: |
          echo "::warning::SEMGREP_APP_TOKEN is not available to this run. Semgrep scans will be skipped."
          echo 'Semgrep scan skipped: no SEMGREP_APP_TOKEN is available. A skipped run is not a security assessment.' >> "$GITHUB_STEP_SUMMARY"

      # Diff-aware PR scans compare against the merge base. Full history lets
      # the scanner find it without repeatedly deepening a shallow clone.
      - name: Checkout
        if: env.SEMGREP_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The scanner's non-root UID differs from the hosted runner UID. semgrep ci
      # always fetches the PR head/base into .git and uses a temporary worktree
      # for the baseline, so grant write access to Git metadata and the report
      # directory only. Ownership stays with the runner, so later Git calls by
      # the runner keep passing the safe.directory ownership check.
      - name: Prepare Semgrep workspace
        if: env.SEMGREP_ENABLED == 'true'
        run: |
          install -d -m 0777 semgrep-results
          chmod -R a+rwX .git

      # PRs report only new findings; push, merge-queue, manual and scheduled
      # runs are full scans. Blocking findings follow the Semgrep AppSec
      # Platform policies and fail the check, as do scanner and platform errors.
      - name: Semgrep scan
        if: env.SEMGREP_ENABLED == 'true'
        uses: ./.github/actions/semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        with:
          sarif-output: semgrep-results/semgrep.sarif

      # Keep evidence after findings or scanner errors without masking failure.
      - name: Retain Semgrep report
        if: always() && !cancelled() && env.SEMGREP_ENABLED == 'true'
        uses: ./.github/actions/upload-artifact
        with:
          name: semgrep-results
          path: semgrep-results/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Semgrep to Code Scanning
        if: >-
          always() && !cancelled() &&
          env.SEMGREP_ENABLED == 'true' &&
          hashFiles('semgrep-results/semgrep.sarif') != ''
        uses: ./.github/actions/codeql-action
        with:
          phase: upload-sarif
          sarif_file: semgrep-results/semgrep.sarif
          category: semgrep
