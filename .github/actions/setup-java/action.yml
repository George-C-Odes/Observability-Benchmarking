name: Set up Java
description: Set up Java using the repository's shared, pinned GitHub action.

inputs:
  distribution:
    description: Java distribution to install.
    required: true
  java-version:
    description: Java version to install.
    required: true
  cache:
    description: Build tool whose dependencies should be cached (maven, gradle, or sbt).
    required: false
  cache-dependency-path:
    description: Dependency file paths or globs used to calculate the cache key.
    required: false

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: ${{ inputs.distribution }}
        java-version: ${{ inputs.java-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
