name: Cache build data
description: Restore and save non-secret build data with the shared pinned cache action.
inputs:
  path:
    description: Files or directories to cache.
    required: true
  key:
    description: Exact cache key.
    required: true
  restore-keys:
    description: Optional ordered fallback key prefixes.
    required: false
outputs:
  cache-hit:
    description: Whether an exact cache entry was restored.
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Restore and save cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        key: ${{ inputs.key }}
        restore-keys: ${{ inputs.restore-keys }}
