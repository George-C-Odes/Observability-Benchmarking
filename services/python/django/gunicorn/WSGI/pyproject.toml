[tool.ruff]
target-version = "py313"
line-length = 100
src = ["hello_project"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The startup hook verifies ownership, mode 0700, and symlinks before using tmpfs.
"gunicorn.conf.py" = ["S108"]

[tool.ruff.lint.isort]
known-first-party = ["hello_project", "obbench_django_common"]