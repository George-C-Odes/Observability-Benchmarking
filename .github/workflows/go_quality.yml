name: Go Quality

# Scope: both Go modules.
#   services/go/enhanced — full quality pipeline (golangci-lint, vet, test,
#     build, govulncheck, hosted HTML report).
#   services/go/simple — full quality pipeline (golangci-lint, vet, test,
#     build, govulncheck, hosted HTML report).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/go/**'
      - 'scripts/pages/generate-go-quality-report.mjs'
      - 'scripts/pages/report-helpers.mjs'
      - 'scripts/golangci-lint-asset*.mjs'
      - '.github/workflows/go_quality.yml'
      - '.github/go-tools/**'
      - '.github/actions/setup-go/**'
      - '.github/actions/setup-node/**'
      - '.github/actions/upload-artifact/**'
  push:
    branches:
      - main
    paths:
      - 'services/go/**'
      - 'scripts/pages/generate-go-quality-report.mjs'
      - 'scripts/pages/report-helpers.mjs'
      - 'scripts/golangci-lint-asset*.mjs'
      - '.github/workflows/go_quality.yml'
      - '.github/go-tools/**'
      - '.github/actions/setup-go/**'
      - '.github/actions/setup-node/**'
      - '.github/actions/upload-artifact/**'
  schedule:
    # Weekly scan — Monday at 06:00 UTC (staggered after CodeQL at 05:30).
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - module_dir: services/go/enhanced
            check_name: Enhanced — lint, vet & test
            report_title: Go Enhanced Service
            artifact_name: quality-report-go
          - module_dir: services/go/simple
            check_name: Simple — lint, vet, test & build
            report_title: Go Simple Service
            artifact_name: quality-report-go-simple
    defaults:
      run:
        working-directory: ${{ matrix.module_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: ${{ matrix.module_dir }}/go.mod
          cache-dependency-path: |
            ${{ matrix.module_dir }}/go.sum
            .github/go-tools/go.sum

      - name: Test golangci-lint release lookup
        working-directory: .
        run: node --test scripts/golangci-lint-asset.test.mjs

      - name: Download golangci-lint
        timeout-minutes: 6
        working-directory: .
        shell: bash
        env:
          GOLANGCI_LINT_VERSION: '2.15.0'
          GOLANGCI_LINT_SHA256: '9b7fe6a6bf6334b98decf8d86b11415ea7889afdabdd1959fdce23af2a9ebcea'
        run: |
          download_lint() {
            curl --fail --silent --show-error --location \
              --retry 2 --retry-delay 10 --retry-max-time 60 \
              --connect-timeout 15 --max-time 60 \
              --proto '=https' --proto-redir '=https' \
              --header 'Accept: application/octet-stream' \
              --output "$RUNNER_TEMP/golangci-lint.tar.gz" "$1"
          }
          archive="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64"
          if ! download_lint "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/${archive}.tar.gz"; then
            echo '::warning::golangci-lint release download failed; trying the public release-asset API.'
            asset_url="$(node scripts/golangci-lint-asset.mjs "$GOLANGCI_LINT_VERSION")"
            download_lint "$asset_url"
          fi
          printf '%s  %s\n' "$GOLANGCI_LINT_SHA256" "$RUNNER_TEMP/golangci-lint.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/golangci-lint"
          tar -xzf "$RUNNER_TEMP/golangci-lint.tar.gz" -C "$RUNNER_TEMP/golangci-lint" \
            --strip-components=1 "$archive/golangci-lint"
          chmod +x "$RUNNER_TEMP/golangci-lint/golangci-lint"
          echo "$RUNNER_TEMP/golangci-lint" >> "$GITHUB_PATH"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          install-only: true
          working-directory: ${{ matrix.module_dir }}
          # Keep the action's lint cache; use the verified binary on PATH.
          # The later lint step captures JSON output for the Pages report.

      - name: Print tool versions
        id: versions
        run: |
          go_ver="$(go version | awk '{print $3}')"
          lint_ver="$(golangci-lint version --short 2>&1 || echo unknown)"
          echo "Go: $go_ver"
          echo "golangci-lint: $lint_ver"
          echo "go=$go_ver"           >> "$GITHUB_OUTPUT"
          echo "golangci_lint=$lint_ver" >> "$GITHUB_OUTPUT"

      - name: Download dependencies
        run: go mod download

      - name: Check go.mod tidiness
        run: |
          go mod tidy -diff
          git diff --exit-code go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        id: lint
        run: |
          # The config file (.golangci.yml) writes both colored-line-number
          # to stdout and JSON to golangci-lint-report.json in a single pass.
          golangci-lint run

      - name: Unit tests
        run: go test ./... -race -count=1

      - name: Build check
        run: go build ./cmd/server

      - name: Govulncheck
        continue-on-error: true
        run: |
          # Build the scanner from its dedicated module and checksum lock.
          go -C "$GITHUB_WORKSPACE/.github/go-tools" build -mod=readonly \
            -o "$RUNNER_TEMP/govulncheck" golang.org/x/vuln/cmd/govulncheck
          "$RUNNER_TEMP/govulncheck" ./...

      # ------------------------------------------------------------------
      # Quality report: generate an HTML report from the JSON output
      # captured during the lint step so the Pages workflow can host it
      # alongside the Qodana and Next.js reports.  Steps run with
      # `if: always()` so that a failing lint still produces a
      # downloadable report artifact.
      # ------------------------------------------------------------------


      - name: Set up Node.js (for report generation)
        if: always() && !cancelled()
        uses: ./.github/actions/setup-node

      - name: Generate quality report
        if: always() && !cancelled()
        env:
          GOLANGCI_LINT_VERSION: ${{ steps.versions.outputs.golangci_lint }}
          GO_VERSION: ${{ steps.versions.outputs.go }}
          REPORT_TITLE: ${{ matrix.report_title }}
        run: node ../../../scripts/pages/generate-go-quality-report.mjs

      - name: Upload quality report
        if: always() && !cancelled()
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.module_dir }}/quality-report/
          retention-days: 30
          if-no-files-found: warn

