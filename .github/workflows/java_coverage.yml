name: Java Coverage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/java/**'
      - 'utils/orchestrator/**'
      - '.github/workflows/java_coverage.yml'
      - 'scripts/sync_coverage_thresholds.py'
      - 'scripts/test_local_coverage.py'
      - 'scripts/coverage_gate.py'
      - 'scripts/coverage-thresholds.json'
      - 'scripts/test_coverage_gate.py'
      - 'scripts/coverage_summary.py'
      - 'scripts/test_coverage_summary.py'
      - '.github/actions/setup-java/**'
      - '.github/actions/setup-node/**'
      - '.github/actions/upload-artifact/**'
      - '.github/actions/codecov-upload/**'
  push:
    branches:
      - main
    paths:
      - 'services/java/**'
      - 'utils/orchestrator/**'
      - '.github/workflows/java_coverage.yml'
      - 'scripts/sync_coverage_thresholds.py'
      - 'scripts/test_local_coverage.py'
      - 'scripts/coverage_gate.py'
      - 'scripts/coverage-thresholds.json'
      - 'scripts/test_coverage_gate.py'
      - 'scripts/coverage_summary.py'
      - 'scripts/test_coverage_summary.py'
      - '.github/actions/setup-java/**'
      - '.github/actions/setup-node/**'
      - '.github/actions/upload-artifact/**'
      - '.github/actions/codecov-upload/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: spring-tomcat
            module_dir: services/java/spring/jvm/tomcat
          - name: spring-netty
            module_dir: services/java/spring/jvm/netty
          - name: quarkus-jvm
            module_dir: services/java/quarkus/jvm
          - name: micronaut-jvm
            module_dir: services/java/micronaut/jvm
          - name: helidon-se-jvm
            module_dir: services/java/helidon/se/jvm
          - name: helidon-mp-jvm
            module_dir: services/java/helidon/mp/jvm
          - name: spark-jvm
            module_dir: services/java/spark/jvm
          - name: javalin-jvm
            module_dir: services/java/javalin/jvm
          - name: dropwizard-jvm
            module_dir: services/java/dropwizard/jvm
          - name: vertx-jvm
            module_dir: services/java/vertx/jvm
          - name: pekko-jvm
            module_dir: services/java/pekko/jvm
          - name: orchestrator
            module_dir: utils/orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: ./.github/actions/setup-java
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            ${{ matrix.module_dir }}/pom.xml

      - name: Set up Node for orchestrator smoke tests
        if: matrix.name == 'orchestrator'
        uses: ./.github/actions/setup-node

      - name: Test orchestrator smoke request boundaries
        if: matrix.name == 'orchestrator'
        run: node --test utils/orchestrator/scripts/direct-sse-smoke.test.mjs

      - name: Run tests with coverage
        id: build
        working-directory: ${{ matrix.module_dir }}
        run: mvn verify -B -q -Dcheckstyle.skip=true

      # ── Parse JaCoCo XML and write GitHub Step Summary ──
      - name: Enforce module coverage thresholds
        if: always() && !cancelled()
        env:
          MODULE_NAME: ${{ matrix.name }}
        run: python3 "$GITHUB_WORKSPACE/scripts/coverage_gate.py" "$MODULE_NAME"

      - name: Generate coverage summary
        if: always() && !cancelled()
        env:
          MODULE_NAME: ${{ matrix.name }}
          MODULE_DIR: ${{ matrix.module_dir }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: python3 "$GITHUB_WORKSPACE/scripts/coverage_summary.py" java

      - name: Upload coverage report
        if: always() && !cancelled()
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-java-${{ matrix.name }}
          path: |
            ${{ matrix.module_dir }}/target/site/jacoco/
          retention-days: 30
          if-no-files-found: warn

      # ── Codecov upload ──────────────────────────────────────────────
      # Additional reporting layer — does NOT replace the GitHub Step
      # Summary or artifact uploads above.  Codecov provides PR
      # annotations, coverage diffs, and trend tracking.
      #
      # Flag naming: java-{matrix.name}  (e.g., java-spring-tomcat).
      # See codecov.yml at the repo root for flag → path mappings and
      # component definitions.
      #
      # Authentication: the `token` input is set explicitly, so a
      # CODECOV_TOKEN repository secret is required.  Generate it at
      # https://app.codecov.io/gh/{owner}/{repo}/settings and add it
      # under Settings → Secrets and variables → Actions.
      # To switch to tokenless (OIDC) uploads for public repos, remove
      # the `token:` input and add `permissions: id-token: write` to
      # this workflow.
      - name: Upload to Codecov
        if: always() && !cancelled() && hashFiles(format('{0}/target/site/jacoco/jacoco.xml', matrix.module_dir)) != ''
        uses: ./.github/actions/codecov-upload
        with:
          files: ${{ matrix.module_dir }}/target/site/jacoco/jacoco.xml
          flags: java-${{ matrix.name }}
          name: java-${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
