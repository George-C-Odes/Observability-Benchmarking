name: Qodana

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/java/**'
      - 'utils/orchestrator/**'
      - '.github/workflows/qodana_code_quality.yml'
      - '.github/actions/upload-artifact/**'
      - 'qodana.yaml'
      - '.qodana/baseline/**'
  push:
    branches:
      - main
    paths:
      - 'services/java/**'
      - 'utils/orchestrator/**'
      - '.github/workflows/qodana_code_quality.yml'
      - '.github/actions/upload-artifact/**'
      - 'qodana.yaml'
      - '.qodana/baseline/**'

permissions: {}

jobs:
  qodana:
    permissions:
      contents: read
      checks: write
    name: Qodana (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # `services/java` is analyzed as one scoped Qodana job, but the shared
          # bootstrap in `qodana.yaml` compiles every Maven module under that
          # tree so symbol resolution works across all Java service variants.
          - name: services-java
            source_dir: services/java
            baseline_file: .qodana/baseline/services-java.sarif.json
          - name: orchestrator
            source_dir: utils/orchestrator
            baseline_file: .qodana/baseline/orchestrator.sarif.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Qodana CLI
        timeout-minutes: 10
        shell: bash
        env:
          # Keep these aligned with common/cli.json in the pinned qodana-action.
          QODANA_CLI_VERSION: '2026.2.2'
          QODANA_CLI_SHA256: 'b1fc01fb5825f4c6382f9cedcfe97d4a8eeaaddc9f5384a3b5870ca63e231c6f'
        run: |
          download_qodana() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 10 --retry-max-time 120 \
              --connect-timeout 15 --max-time 120 \
              --proto '=https' --proto-redir '=https' \
              --header 'Accept: application/octet-stream' \
              --output "$RUNNER_TEMP/qodana-cli.tar.gz" "$1"
          }
          if ! download_qodana "https://github.com/JetBrains/qodana-cli/releases/download/v${QODANA_CLI_VERSION}/qodana_linux_x86_64.tar.gz"; then
            echo '::warning::Qodana CLI release download failed; trying the public release-asset API.'
            # Fixed asset for v2026.2.2 linux_x86_64; update together with the pins.
            # No credentials are sent; HTTPS redirects reach GitHub's asset CDN.
            download_qodana 'https://api.github.com/repos/JetBrains/qodana-cli/releases/assets/585558698'
          fi
          printf '%s  %s\n' "$QODANA_CLI_SHA256" "$RUNNER_TEMP/qodana-cli.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/qodana-cli"
          tar -xzf "$RUNNER_TEMP/qodana-cli.tar.gz" -C "$RUNNER_TEMP/qodana-cli" qodana
          chmod +x "$RUNNER_TEMP/qodana-cli/qodana"
          echo "$RUNNER_TEMP/qodana-cli" >> "$GITHUB_PATH"

      - name: Prepare Qodana arguments
        id: qodana_args
        shell: bash
        env:
          SOURCE_DIR: ${{ matrix.source_dir }}
          BASELINE_FILE: ${{ matrix.baseline_file }}
        run: |
          args="--project-dir=. --only-directory=$SOURCE_DIR"

          if [[ -f "$BASELINE_FILE" ]]; then
            echo "Using Qodana baseline: $BASELINE_FILE"
            args="$args --baseline=$BASELINE_FILE"
          else
            echo "No Qodana baseline found at $BASELINE_FILE; running without a baseline."
          fi

          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        env:
          # Qodana's startup path loads JNA on JDK 25+, which emits a native
          # access warning unless the JVM explicitly allows unnamed modules.
          # Netty also touches sun.misc.Unsafe during startup on newer JDKs, so
          # allow that compatibility mode as well to reduce JVM warning noise.
          JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
          QODANA_ONLY_DIRECTORY: ${{ matrix.source_dir }}
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          use-installed-cli: true
          pr-mode: false
          use-caches: true
          # Prefer the default branch cache so PRs can reuse warm Qodana/Maven
          # caches instead of creating mostly one-off branch-specific entries.
          cache-default-branch-only: true
          post-pr-comment: false
          use-annotations: true
          # The Qodana action pre-zips results before uploading, which makes
          # the artifact incompatible with download-artifact@v4+ (the Pages
          # workflow gets a nested ZIP instead of extracted files).  We keep
          # upload-result for full SARIF/log access under a distinct name and
          # add an explicit upload-artifact step below for the HTML report.
          upload-result: true
          artifact-name: qodana-results-${{ matrix.name }}
          results-dir: ${{ runner.temp }}/qodana/results
          push-fixes: 'none'
          args: ${{ steps.qodana_args.outputs.args }}

      # Explicit upload of the HTML report directory using upload-artifact@v4
      # so that the Pages workflow's download-artifact@v8.0.2 receives extracted
      # files (not the nested ZIP that the Qodana action produces).
      - name: Upload Qodana HTML report
        if: always() && !cancelled()
        uses: ./.github/actions/upload-artifact
        with:
          name: qodana-report-${{ matrix.name }}
          path: ${{ runner.temp }}/qodana/results/report/
          retention-days: 30
          if-no-files-found: warn
