name: Framework Version Sync

on:
  # Only trusted base scripts execute, restricted to same-repository Renovate PRs.
  # Reassess if PR source execution or the publication allowlist changes.
  pull_request_target: # zizmor: ignore[dangerous-triggers] trusted-base execution with validated version and generated-file publication
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions: {}

concurrency:
  group: framework-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      (contains(github.event.pull_request.labels.*.name, 'framework-version') ||
       contains(github.event.pull_request.labels.*.name, 'nextjs-version') ||
       contains(github.event.pull_request.labels.*.name, 'action-docs-version') ||
       contains(github.event.pull_request.labels.*.name, 'docker-cli-version'))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Never check out or run PR code in this privileged event. Only regular
      # branch blobs are read; base scripts validate each version-only route.
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Verify trusted base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$BASE_SHA" ]]; then
            echo '::error::The trusted base moved. Rerun synchronization on the updated PR.'
            exit 1
          fi

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Install trusted npm for lock validation
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'framework-version') &&
          contains(github.event.pull_request.labels.*.name, 'nextjs-version')
        working-directory: utils/nextjs-dash
        # This manifest is from the trusted base checkout, before reading PR data.
        run: |
          package_manager="$(node -p "require('./package.json').packageManager")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Dashboard packageManager must pin an exact npm version.'
            exit 1
          fi
          npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ "$package_manager"

      - name: Validate Renovate version proposal
        if: contains(github.event.pull_request.labels.*.name, 'framework-version')
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/versions/renovate-framework-sync.mjs prepare

      - name: Validate Renovate Next.js proposal
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'framework-version') &&
          contains(github.event.pull_request.labels.*.name, 'nextjs-version')
        id: nextjs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/versions/renovate-framework-sync.mjs prepare-nextjs

      - name: Validate Renovate action pins and render the guide
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'framework-version') &&
          !contains(github.event.pull_request.labels.*.name, 'nextjs-version') &&
          contains(github.event.pull_request.labels.*.name, 'action-docs-version')
        id: actions_docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/versions/renovate-framework-sync.mjs prepare-actions

      - name: Validate Renovate Docker CLI pin and render the docs
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'framework-version') &&
          !contains(github.event.pull_request.labels.*.name, 'nextjs-version') &&
          !contains(github.event.pull_request.labels.*.name, 'action-docs-version') &&
          contains(github.event.pull_request.labels.*.name, 'docker-cli-version')
        id: docker_cli_docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/versions/renovate-framework-sync.mjs prepare-docker-cli

      - name: Select Python runtime
        if: steps.proposal.outputs.changed == 'true'
        id: python
        run: |
          node --input-type=module -e "import { readFileSync, appendFileSync } from 'node:fs'; import { parseColonEnv } from './scripts/readmes/render-readmes.mjs'; const env = parseColonEnv(readFileSync('compose/.env', 'utf8')); appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + env.PYTHON_VERSION + '\n');"

      - name: Set up Python for lock projection
        if: steps.proposal.outputs.changed == 'true'
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Install hash-locked compiler for Python dependency updates
        if: steps.proposal.outputs.python_locks == 'true'
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement .github/requirements/lock-compiler.txt \
            --constraint .github/requirements/lock-compiler.in

      - name: Relay versions and verify generated output
        if: steps.proposal.outputs.changed == 'true' || steps.nextjs.outputs.changed == 'true'
        run: |
          if [ '${{ steps.proposal.outputs.changed }}' = 'true' ]; then
            node scripts/versions/sync-framework-versions.mjs
            node scripts/versions/sync-framework-versions.mjs --check
            python services/python/django/gunicorn/sync_build_locks.py --check
          else
            node scripts/versions/sync-nextjs-tags.mjs
            node scripts/versions/sync-nextjs-tags.mjs --check
          fi

      - name: Commit generated files to the PR
        if: >-
          steps.proposal.outputs.changed == 'true' ||
          steps.nextjs.outputs.changed == 'true' ||
          steps.actions_docs.outputs.changed == 'true' ||
          steps.docker_cli_docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Required to trigger the usual path-scoped CI on the generated commit.
          # A repository-scoped fine-grained PAT needs contents: write and PRs: read.
          RENOVATE_SYNC_TOKEN: ${{ secrets.RENOVATE_SYNC_TOKEN }}
        run: node scripts/versions/renovate-framework-sync.mjs publish

  generate-apm:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      contains(github.event.pull_request.labels.*.name, 'apm-version')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.apm.outputs.changed }}
      head_sha: ${{ steps.apm.outputs.head_sha }}
      lockfile: ${{ steps.refresh.outputs.lockfile }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Verify trusted base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$BASE_SHA" ]]; then
            echo '::error::The trusted base moved. Rerun synchronization on the updated PR.'
            exit 1
          fi

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Validate Renovate APM proposal
        id: apm
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/versions/renovate-framework-sync.mjs prepare-apm

      - name: Set up Python for the APM upgrade
        if: steps.apm.outputs.changed == 'true'
        uses: ./.github/actions/setup-python

      # The newly installed CLI runs on a separate runner from the write token.
      - name: Run full APM upgrade and export the lockfile
        if: steps.apm.outputs.changed == 'true'
        id: refresh
        shell: bash
        env:
          APM_VERSION: ${{ steps.apm.outputs.apm_version }}
          APM_NO_SCRIPTS: '1'
        run: |
          printf '%s\n' "$APM_VERSION" > scripts/apm-version.txt
          python scripts/upgrade-apm.py
          lockfile=my-agent/apm.lock.yaml
          if [[ ! -f "$lockfile" || -L "$lockfile" || $(wc -c < "$lockfile") -gt $((90 * 1024)) ]]; then
            echo '::error::The generated APM lockfile must be a regular file small enough to pass between jobs.'
            exit 1
          fi
          printf 'lockfile=%s\n' "$(base64 -w0 "$lockfile")" >> "$GITHUB_OUTPUT"

  publish-apm:
    needs: generate-apm
    if: needs.generate-apm.outputs.changed == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; NOSONAR - reviewed S7631: current repository's main, base SHA verified before execution; scripts/quality/sonar-exceptions.md
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Verify trusted base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$BASE_SHA" ]]; then
            echo '::error::The trusted base moved. Rerun synchronization on the updated PR.'
            exit 1
          fi

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Revalidate the APM proposal against the generated revision
        id: apm
        env:
          GH_TOKEN: ${{ github.token }}
          APM_GENERATED_HEAD_SHA: ${{ needs.generate-apm.outputs.head_sha }}
        run: node scripts/versions/renovate-framework-sync.mjs prepare-apm

      - name: Commit the generated APM lockfile to the PR
        if: steps.apm.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RENOVATE_SYNC_TOKEN: ${{ secrets.RENOVATE_SYNC_TOKEN }}
          APM_GENERATED_LOCK: ${{ needs.generate-apm.outputs.lockfile }}
        run: node scripts/versions/renovate-framework-sync.mjs publish
