name: Framework Version Sync

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: framework-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      (contains(github.event.pull_request.labels.*.name, 'framework-version') ||
       contains(github.event.pull_request.labels.*.name, 'nextjs-version'))
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # Never check out or run PR code in this privileged event. Only regular
      # branch blobs are read; base scripts validate each version-only route.
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Install trusted npm for lock validation
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'framework-version') &&
          contains(github.event.pull_request.labels.*.name, 'nextjs-version')
        working-directory: utils/nextjs-dash
        # This manifest is from the trusted base checkout, before reading PR data.
        run: |
          package_manager="$(node -p "require('./package.json').packageManager")"
          if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Dashboard packageManager must pin an exact npm version.'
            exit 1
          fi
          npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/ "$package_manager"

      - name: Validate Renovate version proposal
        if: contains(github.event.pull_request.labels.*.name, 'framework-version')
        id: proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/renovate-framework-sync.mjs prepare

      - name: Validate Renovate Next.js proposal
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'framework-version') &&
          contains(github.event.pull_request.labels.*.name, 'nextjs-version')
        id: nextjs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/renovate-framework-sync.mjs prepare-nextjs

      - name: Select Python runtime
        if: steps.proposal.outputs.changed == 'true'
        id: python
        run: |
          node --input-type=module -e "import { readFileSync, appendFileSync } from 'node:fs'; import { parseColonEnv } from './scripts/render-readmes.mjs'; const env = parseColonEnv(readFileSync('compose/.env', 'utf8')); appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + env.PYTHON_VERSION + '\n');"

      - name: Set up Python for lock projection
        if: steps.proposal.outputs.changed == 'true'
        uses: ./.github/actions/setup-python
        with:
          python-version: ${{ steps.python.outputs.version }}

      - name: Install hash-locked compiler when Django changes
        if: steps.proposal.outputs.django == 'true'
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            --requirement .github/requirements/lock-compiler.txt \
            --constraint .github/requirements/lock-compiler.in

      - name: Relay versions and verify generated output
        if: steps.proposal.outputs.changed == 'true' || steps.nextjs.outputs.changed == 'true'
        run: |
          if [ '${{ steps.proposal.outputs.changed }}' = 'true' ]; then
            node scripts/sync-framework-versions.mjs
            node scripts/sync-framework-versions.mjs --check
            python services/python/django/gunicorn/sync_build_locks.py --check
          else
            node scripts/sync-nextjs-tags.mjs
            node scripts/sync-nextjs-tags.mjs --check
          fi

      - name: Commit generated files to the PR
        if: steps.proposal.outputs.changed == 'true' || steps.nextjs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Required to trigger the usual path-scoped CI on the generated commit.
          # A repository-scoped fine-grained PAT needs contents: write and PRs: read.
          RENOVATE_SYNC_TOKEN: ${{ secrets.RENOVATE_SYNC_TOKEN }}
        run: node scripts/renovate-framework-sync.mjs publish
