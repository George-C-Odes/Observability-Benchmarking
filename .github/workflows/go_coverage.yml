name: Go Coverage

env:
  # TODO(node24-migration): Remove once GitHub's default action runtime is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/go/**'
      - '.github/workflows/go_coverage.yml'
      - 'scripts/coverage_summary.py'
      - 'scripts/test_coverage_summary.py'
      - '.github/actions/setup-go/**'
      - '.github/actions/codecov-upload/**'
      - '.github/actions/upload-artifact/**'
      - '.github/actions/download-artifact/**'
  push:
    branches:
      - main
    paths:
      - 'services/go/**'
      - '.github/workflows/go_coverage.yml'
      - 'scripts/coverage_summary.py'
      - 'scripts/test_coverage_summary.py'
      - '.github/actions/setup-go/**'
      - '.github/actions/codecov-upload/**'
      - '.github/actions/upload-artifact/**'
      - '.github/actions/download-artifact/**'

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go-enhanced
            module_dir: services/go/enhanced
          - name: go-simple
            module_dir: services/go/simple
    defaults:
      run:
        working-directory: ${{ matrix.module_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: ${{ matrix.module_dir }}/go.mod
          cache-dependency-path: |
            services/go/enhanced/go.sum
            services/go/simple/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check go.mod tidiness
        run: |
          go mod tidy -diff
          git diff --exit-code go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          }

      - name: Run tests with coverage
        id: test
        run: |
          go test ./... -race -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic

      # ── Parse coverage and write GitHub Step Summary ──────────────
      - name: Generate coverage summary
        if: always() && !cancelled()
        env:
          MODULE_NAME: ${{ matrix.name }}
          MODULE_DIR: ${{ matrix.module_dir }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: python3 "$GITHUB_WORKSPACE/scripts/coverage_summary.py" go

      # ── Generate HTML coverage report ────────────────────────────
      - name: Generate HTML coverage report
        if: always() && !cancelled() && steps.test.outcome == 'success'
        run: go tool cover -html=coverage.out -o coverage.html

      # ── Upload coverage artifacts ────────────────────────────────
      - name: Upload coverage report
        if: always() && !cancelled()
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-${{ matrix.name }}
          path: |
            ${{ matrix.module_dir }}/coverage.out
            ${{ matrix.module_dir }}/coverage.html
          retention-days: 30
          if-no-files-found: warn

      # ── Fix coverage paths for Codecov ──────────────────────────
      # Go coverage profiles use the module name as the path prefix
      # (e.g. "hello/cmd/server/main.go"), but Codecov needs paths
      # relative to the repository root (e.g. "services/go/simple/
      # cmd/server/main.go").  This step rewrites the prefix so
      # Codecov can match coverage data to source files.
      - name: Fix coverage paths for Codecov
        if: always() && !cancelled() && steps.test.outcome == 'success'
        env:
          MODULE_DIR: ${{ matrix.module_dir }}
        run: |
          go_module="$(head -1 go.mod | awk '{print $2}')"
          echo "Rewriting coverage paths: ${go_module}/ → ${MODULE_DIR}/"
          sed "s|${go_module}/|${MODULE_DIR}/|g" coverage.out > coverage-codecov.out

      # ── Codecov upload ───────────────────────────────────────────
      # Upload Go coverage using the standard coverage.out format.
      # Codecov natively supports Go coverage profiles.
      #
      # Flag naming: go-{module} (e.g., go-enhanced, go-simple).
      # See codecov.yml at the repo root for flag → path mappings
      # and component definitions.
      - name: Upload to Codecov
        if: always() && !cancelled() && steps.test.outcome == 'success'
        uses: ./.github/actions/codecov-upload
        with:
          files: ${{ matrix.module_dir }}/coverage-codecov.out
          flags: ${{ matrix.name }}
          name: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Coverage Gate ─────────────────────────────────────────────────
  # Enforces minimum statement-coverage thresholds for each Go module.
  # Thresholds are intentionally conservative — tighten as test suites grow.
  coverage-gate:
    name: Coverage Gate
    needs: [coverage]
    if: always() && !cancelled()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      THRESHOLD_GO_ENHANCED: 85
      THRESHOLD_GO_SIMPLE: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: services/go/enhanced/go.mod
          cache-dependency-path: |
            services/go/enhanced/go.sum
            services/go/simple/go.sum

      - name: Download enhanced coverage
        uses: ./.github/actions/download-artifact
        with:
          name: coverage-go-enhanced
          path: .coverage/enhanced
        continue-on-error: true

      - name: Download simple coverage
        uses: ./.github/actions/download-artifact
        with:
          name: coverage-go-simple
          path: .coverage/simple
        continue-on-error: true

      - name: Enforce coverage thresholds
        shell: bash
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          failed=0
          if [[ "$COVERAGE_RESULT" != "success" ]]; then
            echo "::error::Coverage jobs did not all succeed ($COVERAGE_RESULT)."
            failed=1
          fi

          check_coverage() {
            local name="$1" module_dir="$2" file="$3" threshold="$4" pct pct_int
            if [[ ! -f "$file" ]]; then
              echo "::error::Coverage file not found for $name: $file"
              failed=1
              return
            fi
            # Profiles contain module-relative import paths (hello/...). Resolve
            # them from the matching module, not the repository root.
            if ! pct="$(cd "$module_dir" && go tool cover -func="$GITHUB_WORKSPACE/$file")"; then
              echo "::error::Could not read coverage for $name"
              failed=1
              return
            fi
            # Extract total coverage from the last line of `go tool cover -func`
            pct="$(printf '%s\n' "$pct" | tail -1 | awk '{print $NF}' | tr -d '%')"
            if [[ ! "$pct" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "::error::Could not parse coverage for $name"
              failed=1
              return
            fi
            # Compare as integers (truncate decimals)
            pct_int="${pct%%.*}"
            echo "$name coverage: ${pct}% (threshold: ${threshold}%)"
            if (( pct_int < threshold )); then
              echo "::error::$name coverage ${pct}% is below the ${threshold}% threshold"
              failed=1
            fi
          }

          # upload-artifact roots each report at its module directory, so the
          # downloaded artifact contains coverage.out directly (no module prefix).
          check_coverage "go-enhanced" "services/go/enhanced" ".coverage/enhanced/coverage.out" "$THRESHOLD_GO_ENHANCED"
          check_coverage "go-simple"   "services/go/simple"   ".coverage/simple/coverage.out"   "$THRESHOLD_GO_SIMPLE"

          if (( failed )); then
            echo ""
            echo "::error::One or more Go modules failed the coverage gate."
            exit 1
          fi
          echo "All Go modules passed coverage thresholds."
