name: pmd

on:
  push:
    branches: [ "main" ]
    paths:
      - 'utils/**'
      - '.github/workflows/pmd.yml'
      - '.github/actions/setup-java/**'
      - '.github/actions/codeql-action/**'
      - '.github/actions/upload-artifact/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'utils/**'
      - '.github/workflows/pmd.yml'
      - '.github/actions/setup-java/**'
      - '.github/actions/codeql-action/**'
      - '.github/actions/upload-artifact/**'
  workflow_dispatch:
  schedule:
    - cron: '29 23 * * 6'

permissions:
  contents: read

jobs:
  pmd-code-scan:
    name: PMD Code Scan
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: ./.github/actions/setup-java
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install PMD
        timeout-minutes: 10
        shell: bash
        env:
          PMD_VERSION: '7.29.0'
          PMD_SHA256: 'd27177c185b837fa57f097e482d1253468aa035379c5eb2671fa0a279109b179'
        run: |
          # Use the CLI because pmd/pmd-github-action still declares Node 20.
          download_pmd() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 10 --retry-max-time 120 \
              --connect-timeout 15 --max-time 120 \
              --proto '=https' --proto-redir '=https' \
              --output "$RUNNER_TEMP/pmd.zip" "$1"
          }
          # Match PMD's published URL: the slash belongs to the release tag.
          if ! download_pmd "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"; then
            echo '::warning::GitHub PMD download failed; trying the official SourceForge mirror.'
            download_pmd "https://sourceforge.net/projects/pmd/files/pmd/${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip/download"
          fi
          printf '%s  %s\n' "$PMD_SHA256" "$RUNNER_TEMP/pmd.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/pmd.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pmd-bin-${PMD_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Run PMD
        shell: bash
        run: |
          # PMD fails by default on violations and analysis errors.
          pmd check \
            --dir utils \
            --rulesets rulesets/java/quickstart.xml \
            --format sarif \
            --report-file pmd-report.sarif

      - name: Upload PMD report artifact
        if: always() && hashFiles('pmd-report.sarif') != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: PMD Report
          path: pmd-report.sarif
          if-no-files-found: error

      - name: Upload SARIF file
        if: always() && hashFiles('pmd-report.sarif') != ''
        uses: ./.github/actions/codeql-action
        with:
          phase: upload-sarif
          sarif_file: pmd-report.sarif
