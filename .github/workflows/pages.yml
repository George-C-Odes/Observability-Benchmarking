name: Deploy GitHub Pages

env:
  # TODO(node24-migration): Remove once GitHub's default action runtime is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main

  # Republish after quality runs so hosted reports stay current.
  #
  # - main-branch quality runs refresh the live site under /quality/
  # - non-main branch quality runs refresh the shared staging site under
  #   /stage/quality/
  #
  # Qodana, Go Quality, and CodeQL upload report artifacts even when the
  # quality gate fails, so those completed failure runs are still useful for
  # Pages publishing. Non-main staging also accepts failed Next.js / Django
  # runs so shared staging reflects the latest branch quality state.
  # Canceled/skipped workflows are ignored because they may not have reached
  # the artifact upload steps.
  workflow_run:
    workflows:
      - Qodana
      - Next.js Dashboard Quality
      - Django Python Quality
      - Go Quality
      - CodeQL
    types:
      - completed

  # Manual runs refresh both report scopes using trusted main code.
  workflow_dispatch:

# Each job declares only the permissions it needs.
permissions: {}

# Keep only one Pages deployment active at a time without interrupting the run in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Run for push / dispatch unconditionally.
    # For workflow_run: accept success everywhere. Accept failures for non-main
    # branch runs so staging quality reports show quality-gate violations.
    # On main/live, also accept failed Qodana, Go Quality, and CodeQL runs,
    # because those workflows still upload publishable HTML reports.
    if: >-
      (github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
      || (github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.head_branch != ''
          && github.event.workflow_run.head_branch != 'main')
      || (github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.name == 'Qodana')
      || (github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.name == 'Go Quality')
      || (github.event.workflow_run.conclusion == 'failure'
          && github.event.workflow_run.name == 'CodeQL'))
      && (github.event_name != 'workflow_run'
          || github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pages: read
    # Shared resolver context; keep tokens scoped to the steps that need them.
    env:
      EVENT_NAME: ${{ github.event_name }}
      WR_ID: ${{ github.event.workflow_run.id }}
      WR_NAME: ${{ github.event.workflow_run.name }}
      WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      WR_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
    steps:
      # workflow_run supplies report data only. Never execute its source revision.
      - name: Checkout trusted site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: ./docs

      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site with Bundler and Jekyll
        shell: bash
        working-directory: ./docs
        env:
          JEKYLL_ENV: production
        run: |
          ruby --version

          # Ensure a Gemfile.lock is present so docs builds are reproducible.
          if [ ! -f Gemfile.lock ]; then
            echo "Error: docs/Gemfile.lock is missing. Please generate and commit it for reproducible GitHub Pages builds." >&2
            exit 1
          fi
          bundle exec jekyll build --destination ../_site

      - name: Resolve live Qodana artifact source run
        id: live_qodana_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_WORKFLOW_NAME: Qodana
          RESOLVE_WORKFLOW_FILE: qodana_code_quality.yml
          RESOLVE_ACCEPTED: success,failure
          RESOLVE_BRANCH_MODE: main
        run: bash scripts/pages/resolve-source.sh

      - name: Inspect available live Qodana artifacts
        id: live_qodana_artifacts
        if: steps.live_qodana_source.outputs.run_id != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QODANA_RUN_ID: ${{ steps.live_qodana_source.outputs.run_id }}
        run: bash scripts/pages/inspect-qodana-artifacts.sh

      - name: Download live Qodana report (services-java)
        id: download_live_qodana_services_java
        if: steps.live_qodana_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: qodana-report-services-java
          path: ./.live-qodana-pages/services-java
          run-id: ${{ steps.live_qodana_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download live Qodana report (orchestrator)
        id: download_live_qodana_orchestrator
        if: steps.live_qodana_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: qodana-report-orchestrator
          path: ./.live-qodana-pages/orchestrator
          run-id: ${{ steps.live_qodana_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # Live /quality (main)
      # ----------------------------------------------------------------

      - name: Resolve live Next.js quality artifact source run
        id: live_nextjs_quality_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_WORKFLOW_NAME: Next.js Dashboard Quality
          RESOLVE_WORKFLOW_FILE: nextjs_dash_quality.yml
          RESOLVE_ACCEPTED: success
          RESOLVE_BRANCH_MODE: main
        run: bash scripts/pages/resolve-source.sh

      - name: Download live Next.js quality report
        id: download_live_nextjs_quality
        if: steps.live_nextjs_quality_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: quality-report-nextjs-dash
          path: ./.live-nextjs-quality-pages/nextjs-dash
          run-id: ${{ steps.live_nextjs_quality_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve live Django Python quality artifact source run
        id: live_django_python_quality_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_WORKFLOW_NAME: Django Python Quality
          RESOLVE_WORKFLOW_FILE: django_python_quality.yml
          RESOLVE_ACCEPTED: success
          RESOLVE_BRANCH_MODE: main
        run: bash scripts/pages/resolve-source.sh

      - name: Download live Django Python quality report
        id: download_live_django_python_quality
        if: steps.live_django_python_quality_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: qodana-report-django-python
          path: ./.live-django-python-quality-pages/django-python
          run-id: ${{ steps.live_django_python_quality_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve live Go quality artifact source run
        id: live_go_quality_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_WORKFLOW_NAME: Go Quality
          RESOLVE_WORKFLOW_FILE: go_quality.yml
          RESOLVE_ACCEPTED: success,failure
          RESOLVE_BRANCH_MODE: main
        run: bash scripts/pages/resolve-source.sh

      - name: Download live Go quality report
        id: download_live_go_quality
        if: steps.live_go_quality_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: quality-report-go
          path: ./.live-go-quality-pages/go
          run-id: ${{ steps.live_go_quality_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download live Go Simple quality report
        id: download_live_go_simple_quality
        if: steps.live_go_quality_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: quality-report-go-simple
          path: ./.live-go-simple-quality-pages/go-simple
          run-id: ${{ steps.live_go_quality_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve live CodeQL artifact source run
        id: live_codeql_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_WORKFLOW_NAME: CodeQL
          RESOLVE_WORKFLOW_FILE: codeql.yml
          RESOLVE_ACCEPTED: success,failure
          RESOLVE_BRANCH_MODE: main
        run: bash scripts/pages/resolve-source.sh

      - name: Download live CodeQL quality report
        id: download_live_codeql_quality
        if: steps.live_codeql_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: quality-report-codeql
          path: ./.live-codeql-quality-pages/codeql
          run-id: ${{ steps.live_codeql_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble live quality pages
        shell: bash
        env:
          SERVICES_ARTIFACT_PRESENT: ${{ steps.live_qodana_artifacts.outputs.services_java_present }}
          ORCHESTRATOR_ARTIFACT_PRESENT: ${{ steps.live_qodana_artifacts.outputs.orchestrator_present }}
          SERVICES_DOWNLOAD_OUTCOME: ${{ steps.download_live_qodana_services_java.outcome }}
          ORCHESTRATOR_DOWNLOAD_OUTCOME: ${{ steps.download_live_qodana_orchestrator.outcome }}
          QODANA_RUN_ID: ${{ steps.live_qodana_source.outputs.run_id }}
          QODANA_HEAD_SHA: ${{ steps.live_qodana_source.outputs.head_sha }}
          QODANA_PAGES_DIR: ./.live-qodana-pages
          NEXTJS_QUALITY_RUN_ID: ${{ steps.live_nextjs_quality_source.outputs.run_id }}
          NEXTJS_QUALITY_HEAD_SHA: ${{ steps.live_nextjs_quality_source.outputs.head_sha }}
          NEXTJS_DOWNLOAD_OUTCOME: ${{ steps.download_live_nextjs_quality.outcome }}
          NEXTJS_QUALITY_PAGES_DIR: ./.live-nextjs-quality-pages
          DJANGO_PYTHON_QUALITY_RUN_ID: ${{ steps.live_django_python_quality_source.outputs.run_id }}
          DJANGO_PYTHON_QUALITY_HEAD_SHA: ${{ steps.live_django_python_quality_source.outputs.head_sha }}
          DJANGO_PYTHON_DOWNLOAD_OUTCOME: ${{ steps.download_live_django_python_quality.outcome }}
          DJANGO_PYTHON_QUALITY_PAGES_DIR: ./.live-django-python-quality-pages
          GO_QUALITY_RUN_ID: ${{ steps.live_go_quality_source.outputs.run_id }}
          GO_QUALITY_HEAD_SHA: ${{ steps.live_go_quality_source.outputs.head_sha }}
          GO_DOWNLOAD_OUTCOME: ${{ steps.download_live_go_quality.outcome }}
          GO_QUALITY_PAGES_DIR: ./.live-go-quality-pages
          GO_SIMPLE_QUALITY_RUN_ID: ${{ steps.live_go_quality_source.outputs.run_id }}
          GO_SIMPLE_QUALITY_HEAD_SHA: ${{ steps.live_go_quality_source.outputs.head_sha }}
          GO_SIMPLE_DOWNLOAD_OUTCOME: ${{ steps.download_live_go_simple_quality.outcome }}
          GO_SIMPLE_QUALITY_PAGES_DIR: ./.live-go-simple-quality-pages
          CODEQL_QUALITY_RUN_ID: ${{ steps.live_codeql_source.outputs.run_id }}
          CODEQL_QUALITY_HEAD_SHA: ${{ steps.live_codeql_source.outputs.head_sha }}
          CODEQL_DOWNLOAD_OUTCOME: ${{ steps.download_live_codeql_quality.outcome }}
          CODEQL_QUALITY_PAGES_DIR: ./.live-codeql-quality-pages
          SITE_DIR: ./_site
          QUALITY_SITE_SUBDIR: quality
          QUALITY_CONTEXT_DESCRIPTION: Latest published code-quality reports from GitHub Actions on <code>main</code>.
        run: bash scripts/pages/assemble-quality-pages.sh

      # ----------------------------------------------------------------
      # Staging /stage/quality (latest non-main branch reports)
      # ----------------------------------------------------------------

      - name: Resolve stage Qodana artifact source run
        id: stage_qodana_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_WORKFLOW_NAME: Qodana
          RESOLVE_WORKFLOW_FILE: qodana_code_quality.yml
          RESOLVE_ACCEPTED: success,failure
          RESOLVE_BRANCH_MODE: non-main
        run: bash scripts/pages/resolve-source.sh

      - name: Inspect available stage Qodana artifacts
        id: stage_qodana_artifacts
        if: steps.stage_qodana_source.outputs.run_id != ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QODANA_RUN_ID: ${{ steps.stage_qodana_source.outputs.run_id }}
        run: bash scripts/pages/inspect-qodana-artifacts.sh

      - name: Download stage Qodana report (services-java)
        id: download_stage_qodana_services_java
        if: steps.stage_qodana_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: qodana-report-services-java
          path: ./.stage-qodana-pages/services-java
          run-id: ${{ steps.stage_qodana_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download stage Qodana report (orchestrator)
        id: download_stage_qodana_orchestrator
        if: steps.stage_qodana_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: qodana-report-orchestrator
          path: ./.stage-qodana-pages/orchestrator
          run-id: ${{ steps.stage_qodana_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stage Next.js quality artifact source run
        id: stage_nextjs_quality_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_WORKFLOW_NAME: Next.js Dashboard Quality
          RESOLVE_WORKFLOW_FILE: nextjs_dash_quality.yml
          RESOLVE_ACCEPTED: success,failure
          RESOLVE_BRANCH_MODE: non-main
        run: bash scripts/pages/resolve-source.sh

      - name: Download stage Next.js quality report
        id: download_stage_nextjs_quality
        if: steps.stage_nextjs_quality_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: quality-report-nextjs-dash
          path: ./.stage-nextjs-quality-pages/nextjs-dash
          run-id: ${{ steps.stage_nextjs_quality_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stage Django Python quality artifact source run
        id: stage_django_python_quality_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_WORKFLOW_NAME: Django Python Quality
          RESOLVE_WORKFLOW_FILE: django_python_quality.yml
          RESOLVE_ACCEPTED: success,failure
          RESOLVE_BRANCH_MODE: non-main
        run: bash scripts/pages/resolve-source.sh

      - name: Download stage Django Python quality report
        id: download_stage_django_python_quality
        if: steps.stage_django_python_quality_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: qodana-report-django-python
          path: ./.stage-django-python-quality-pages/django-python
          run-id: ${{ steps.stage_django_python_quality_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stage Go quality artifact source run
        id: stage_go_quality_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_WORKFLOW_NAME: Go Quality
          RESOLVE_WORKFLOW_FILE: go_quality.yml
          RESOLVE_ACCEPTED: success,failure
          RESOLVE_BRANCH_MODE: non-main
        run: bash scripts/pages/resolve-source.sh

      - name: Download stage Go quality report
        id: download_stage_go_quality
        if: steps.stage_go_quality_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: quality-report-go
          path: ./.stage-go-quality-pages/go
          run-id: ${{ steps.stage_go_quality_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download stage Go Simple quality report
        id: download_stage_go_simple_quality
        if: steps.stage_go_quality_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: quality-report-go-simple
          path: ./.stage-go-simple-quality-pages/go-simple
          run-id: ${{ steps.stage_go_quality_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve stage CodeQL artifact source run
        id: stage_codeql_source
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_WORKFLOW_NAME: CodeQL
          RESOLVE_WORKFLOW_FILE: codeql.yml
          RESOLVE_ACCEPTED: success,failure
          RESOLVE_BRANCH_MODE: non-main
        run: bash scripts/pages/resolve-source.sh

      - name: Download stage CodeQL quality report
        id: download_stage_codeql_quality
        if: steps.stage_codeql_source.outputs.run_id != ''
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          name: quality-report-codeql
          path: ./.stage-codeql-quality-pages/codeql
          run-id: ${{ steps.stage_codeql_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble stage quality pages
        shell: bash
        env:
          SERVICES_ARTIFACT_PRESENT: ${{ steps.stage_qodana_artifacts.outputs.services_java_present }}
          ORCHESTRATOR_ARTIFACT_PRESENT: ${{ steps.stage_qodana_artifacts.outputs.orchestrator_present }}
          SERVICES_DOWNLOAD_OUTCOME: ${{ steps.download_stage_qodana_services_java.outcome }}
          ORCHESTRATOR_DOWNLOAD_OUTCOME: ${{ steps.download_stage_qodana_orchestrator.outcome }}
          QODANA_RUN_ID: ${{ steps.stage_qodana_source.outputs.run_id }}
          QODANA_HEAD_SHA: ${{ steps.stage_qodana_source.outputs.head_sha }}
          QODANA_PAGES_DIR: ./.stage-qodana-pages
          NEXTJS_QUALITY_RUN_ID: ${{ steps.stage_nextjs_quality_source.outputs.run_id }}
          NEXTJS_QUALITY_HEAD_SHA: ${{ steps.stage_nextjs_quality_source.outputs.head_sha }}
          NEXTJS_DOWNLOAD_OUTCOME: ${{ steps.download_stage_nextjs_quality.outcome }}
          NEXTJS_QUALITY_PAGES_DIR: ./.stage-nextjs-quality-pages
          DJANGO_PYTHON_QUALITY_RUN_ID: ${{ steps.stage_django_python_quality_source.outputs.run_id }}
          DJANGO_PYTHON_QUALITY_HEAD_SHA: ${{ steps.stage_django_python_quality_source.outputs.head_sha }}
          DJANGO_PYTHON_DOWNLOAD_OUTCOME: ${{ steps.download_stage_django_python_quality.outcome }}
          DJANGO_PYTHON_QUALITY_PAGES_DIR: ./.stage-django-python-quality-pages
          GO_QUALITY_RUN_ID: ${{ steps.stage_go_quality_source.outputs.run_id }}
          GO_QUALITY_HEAD_SHA: ${{ steps.stage_go_quality_source.outputs.head_sha }}
          GO_DOWNLOAD_OUTCOME: ${{ steps.download_stage_go_quality.outcome }}
          GO_QUALITY_PAGES_DIR: ./.stage-go-quality-pages
          GO_SIMPLE_QUALITY_RUN_ID: ${{ steps.stage_go_quality_source.outputs.run_id }}
          GO_SIMPLE_QUALITY_HEAD_SHA: ${{ steps.stage_go_quality_source.outputs.head_sha }}
          GO_SIMPLE_DOWNLOAD_OUTCOME: ${{ steps.download_stage_go_simple_quality.outcome }}
          GO_SIMPLE_QUALITY_PAGES_DIR: ./.stage-go-simple-quality-pages
          CODEQL_QUALITY_RUN_ID: ${{ steps.stage_codeql_source.outputs.run_id }}
          CODEQL_QUALITY_HEAD_SHA: ${{ steps.stage_codeql_source.outputs.head_sha }}
          CODEQL_DOWNLOAD_OUTCOME: ${{ steps.download_stage_codeql_quality.outcome }}
          CODEQL_QUALITY_PAGES_DIR: ./.stage-codeql-quality-pages
          SITE_DIR: ./_site
          QUALITY_SITE_SUBDIR: stage/quality
          QUALITY_CONTEXT_DESCRIPTION: Shared staging quality reports from the latest completed non-<code>main</code> branch workflows. This view is overwritten on each new branch publish.
        run: bash scripts/pages/assemble-quality-pages.sh

      - name: Upload Pages Artifact
        uses: ./.github/actions/upload-pages-artifact

  # Deployment job
  # No explicit `if` needed — `needs: build` already ensures this job only
  # runs when the build job succeeds (which has its own workflow_run gate).
  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
