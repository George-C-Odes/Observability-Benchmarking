name: Upload artifact
description: Upload artifacts using the repository's shared, pinned GitHub action.

# Keep the upstream inputs and defaults so workflows can use this action directly.
inputs:
  name:
    description: Artifact name, ignored when archive is false.
    required: false
    default: artifact
  path:
    description: File, directory, or glob describing the files to upload.
    required: true
  if-no-files-found:
    description: Missing file behavior (warn, error, or ignore).
    required: false
    default: warn
  retention-days:
    description: Retention in days. Defaults to the repository setting.
    required: false
  compression-level:
    description: Archive compression level, from 0 to 9.
    required: false
    default: '6'
  overwrite:
    description: Replace an existing artifact with the same name.
    required: false
    default: 'false'
  include-hidden-files:
    description: Include hidden files in the artifact.
    required: false
    default: 'false'
  archive:
    description: Archive files before uploading. False permits a single file only.
    required: false
    default: 'true'

outputs:
  artifact-id:
    description: ID of the uploaded artifact.
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-url:
    description: Authenticated download URL of the uploaded artifact.
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-digest:
    description: SHA-256 digest of the uploaded artifact.
    value: ${{ steps.upload.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    # Uploads must still run when the caller uses always() after a failed step.
    - name: Upload artifact
      id: upload
      if: ${{ always() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: ${{ inputs.overwrite }}
        include-hidden-files: ${{ inputs.include-hidden-files }}
        archive: ${{ inputs.archive }}
