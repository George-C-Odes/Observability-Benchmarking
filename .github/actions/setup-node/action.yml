name: Set up Node.js
description: Set up Node.js using the repository's shared, pinned GitHub action.

inputs:
  node-version:
    description: Node.js version to install; callers select their required runtime.
    required: true
  cache:
    description: Package manager whose dependencies should be cached (npm, yarn, or pnpm).
    required: false
  cache-dependency-path:
    description: Dependency file paths or globs used to calculate the cache key.
    required: false

runs:
  using: composite
  steps:
    # Respect callers that explicitly run report setup after an earlier failure.
    - name: Set up Node.js
      if: ${{ always() }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
