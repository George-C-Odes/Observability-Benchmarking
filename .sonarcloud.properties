# SonarQube Cloud automatic analysis (not sonar-project.properties).
# Only the Python version line is managed by scripts/sync-framework-versions.mjs.
# Other analysis settings remain authored here; keep production code in scope.
sonar.python.version=3.13
sonar.sourceEncoding=UTF-8

# Binary assets are not source text. SonarCloud can warn when indexing them as
# UTF-8; only these signature-verified image types are excluded (not text SVGs).
# Background: https://community.sonarsource.com/t/185002/6
sonar.exclusions=**/*.png,**/*.ico

# The landing page is rendered from docs/index.template.html by render-readmes.mjs.
# Check duplication in the authored template, not its generated copy; both files
# remain in scope for other analysis. Keep this limited to the generated output.
sonar.cpd.exclusions=docs/index.html

# Candidate roots are literal paths; inclusion patterns select only tests/helpers.
# Shared roots (scripts, integration-tests, Go, Django) still contain production
# source. Do not exclude those roots wholesale or set sonar.sources to tests only.
# Java automatic analysis retains its Maven/Gradle src/main and src/test layout.
sonar.tests=scripts,integration-tests,services/python/django/gunicorn,services/go,utils/nextjs-dash/__tests__,utils/nextjs-dash/vitest.setup.ts
sonar.test.inclusions=scripts/**/*.test.mjs,scripts/test_*.py,scripts/test-helpers.mjs,integration-tests/test_*.py,services/python/django/gunicorn/test_*.py,services/python/django/gunicorn/common/src/obbench_django_common/tests/**,services/go/**/*_test.go,utils/nextjs-dash/__tests__/**,utils/nextjs-dash/vitest.setup.ts
