name: Django Python Coverage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/python/**'
      - '.github/workflows/django_python_coverage.yml'
      - '.github/actions/setup-python/**'
      - '.github/actions/install-python-dependencies/**'
      - '.github/requirements/**'
      - '.github/actions/upload-artifact/**'
      - '.github/actions/codecov-upload/**'
      - 'scripts/coverage_gate.py'
      - 'scripts/coverage-thresholds.json'
      - 'scripts/test_coverage_gate.py'
      - 'scripts/coverage_summary.py'
      - 'scripts/test_coverage_summary.py'
      - 'codecov.yml'
  push:
    branches:
      - main
    paths:
      - 'services/python/**'
      - '.github/workflows/django_python_coverage.yml'
      - '.github/actions/setup-python/**'
      - '.github/actions/install-python-dependencies/**'
      - '.github/requirements/**'
      - '.github/actions/upload-artifact/**'
      - '.github/actions/codecov-upload/**'
      - 'scripts/coverage_gate.py'
      - 'scripts/coverage-thresholds.json'
      - 'scripts/test_coverage_gate.py'
      - 'scripts/coverage_summary.py'
      - 'scripts/test_coverage_summary.py'
      - 'codecov.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (${{ matrix.summary_name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OTEL_SDK_DISABLED: 'true'
      PYROSCOPE_ENABLED: 'false'
      COMMON_SOURCE_DIR: services/python/django/gunicorn/common/src/obbench_django_common
      COVERAGE_OUTPUT_DIR: ${{ github.workspace }}/${{ matrix.module_dir }}
      COVERAGE_FILE: ${{ github.workspace }}/${{ matrix.module_dir }}/.coverage
    strategy:
      fail-fast: false
      matrix:
        include:
          - summary_name: django-platform
            codecov_flag: python-django-platform
            module_dir: services/python/django/gunicorn/WSGI
          - summary_name: django-reactive
            codecov_flag: python-django-reactive
            module_dir: services/python/django/gunicorn/ASGI
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          cache: pip
          cache-dependency-path: |
            .github/requirements/**
            services/python/django/gunicorn/common/pyproject.toml
            ${{ matrix.module_dir }}/requirements.txt
            ${{ matrix.module_dir }}/requirements-dev.txt

      - name: Install dependencies
        uses: ./.github/actions/install-python-dependencies
        with:
          requirements: |
            ${{ matrix.module_dir }}/requirements.txt
            ${{ matrix.module_dir }}/requirements-dev.txt
            .github/requirements/coverage.in
          local-project: services/python/django/gunicorn/common
          editable: 'true'

      - name: Run tests with coverage
        id: test
        run: |
          python -m coverage run \
            --branch \
            --source="${{ matrix.module_dir }},${COMMON_SOURCE_DIR}" \
            --omit="*/tests/*" \
            ${{ matrix.module_dir }}/manage.py test obbench_django_common.tests --verbosity=2

      - name: Generate coverage reports
        if: always() && !cancelled() && steps.test.outcome == 'success'
        run: |
          python -m coverage json -o "${COVERAGE_OUTPUT_DIR}/coverage-summary.json" --pretty-print
          python -m coverage xml -o "${COVERAGE_OUTPUT_DIR}/coverage.xml"
          python -m coverage html -d "${COVERAGE_OUTPUT_DIR}/htmlcov"
          python -m coverage report -m > "${COVERAGE_OUTPUT_DIR}/coverage-report.txt"

      - name: Verify generated coverage files
        if: always() && !cancelled() && steps.test.outcome == 'success'
        run: |
          test -f "${COVERAGE_OUTPUT_DIR}/coverage.xml"
          test -f "${COVERAGE_OUTPUT_DIR}/coverage-summary.json"
          test -f "${COVERAGE_FILE}"

      - name: Enforce runtime and shared-package coverage thresholds
        if: always() && !cancelled()
        env:
          MODULE_NAME: ${{ matrix.summary_name }}
        run: python3 "$GITHUB_WORKSPACE/scripts/coverage_gate.py" "$MODULE_NAME" django-common --report "${COVERAGE_OUTPUT_DIR}/coverage-summary.json"

      - name: Generate coverage summary
        if: always() && !cancelled()
        env:
          MODULE_NAME: ${{ matrix.summary_name }}
          MODULE_DIR: ${{ matrix.module_dir }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
          COVERAGE_JSON: ${{ github.workspace }}/${{ matrix.module_dir }}/coverage-summary.json
        run: python3 "$GITHUB_WORKSPACE/scripts/coverage_summary.py" python

      - name: Upload coverage report
        if: always() && !cancelled()
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-${{ matrix.codecov_flag }}
          path: |
            ${{ github.workspace }}/${{ matrix.module_dir }}/.coverage
            ${{ github.workspace }}/${{ matrix.module_dir }}/coverage-summary.json
            ${{ github.workspace }}/${{ matrix.module_dir }}/coverage-report.txt
            ${{ github.workspace }}/${{ matrix.module_dir }}/coverage.xml
            ${{ github.workspace }}/${{ matrix.module_dir }}/htmlcov/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload to Codecov
        if: always() && !cancelled() && steps.test.outcome == 'success'
        uses: ./.github/actions/codecov-upload
        with:
          files: ${{ github.workspace }}/${{ matrix.module_dir }}/coverage.xml
          flags: ${{ matrix.codecov_flag }}
          name: ${{ matrix.codecov_flag }}
          token: ${{ secrets.CODECOV_TOKEN }}

