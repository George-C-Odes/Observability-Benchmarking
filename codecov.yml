# Codecov configuration for the Observability-Benchmarking monorepo.
#
# Each language/module uploads coverage with a dedicated flag (set in the
# GitHub Actions workflow).  Flags map to source paths so Codecov can
# correctly attribute lines and produce per-component dashboards.
#
# Docs: https://docs.codecov.com/docs/codecov-yaml
# Validate: curl -X POST --data-binary @codecov.yml https://codecov.io/validate

# ── General ───────────────────────────────────────────────────────────
codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

# ── Coverage status checks ────────────────────────────────────────────
# Informational only — each module job enforces scripts/coverage/coverage-thresholds.json
# through scripts/coverage/coverage_gate.py.  Codecov status checks appear on PRs but never
# block merges.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# ── PR comment ────────────────────────────────────────────────────────
comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true

# ── Flag definitions ──────────────────────────────────────────────────
# Naming convention: java-{matrix.name} | nextjs-dash-{env} | go-{module} | python-{module} | ci-tooling
#
# `carryforward: true` keeps previous coverage data for flags that were
# not uploaded in the current commit.  This is important in a monorepo
# where not every workflow runs on every push (e.g., path-filtered
# triggers or future per-module path filters).
#
# `paths` tells Codecov which source files belong to this flag so
# coverage is attributed correctly in the file viewer and PR diff.

flags:
  # ── Java services (uploaded by java_coverage.yml) ───────────────────
  java-spring-tomcat:
    paths: [services/java/spring/jvm/tomcat/]
    carryforward: true
  java-spring-netty:
    paths: [services/java/spring/jvm/netty/]
    carryforward: true
  java-quarkus-jvm:
    paths: [services/java/quarkus/jvm/]
    carryforward: true
  java-micronaut-jvm:
    paths: [services/java/micronaut/jvm/]
    carryforward: true
  java-helidon-se-jvm:
    paths: [services/java/helidon/se/jvm/]
    carryforward: true
  java-helidon-mp-jvm:
    paths: [services/java/helidon/mp/jvm/]
    carryforward: true
  java-spark-jvm:
    paths: [services/java/spark/jvm/]
    carryforward: true
  java-javalin-jvm:
    paths: [services/java/javalin/jvm/]
    carryforward: true
  java-dropwizard-jvm:
    paths: [services/java/dropwizard/jvm/]
    carryforward: true
  java-vertx-jvm:
    paths: [services/java/vertx/jvm/]
    carryforward: true
  java-pekko-jvm:
    paths: [services/java/pekko/jvm/]
    carryforward: true
  java-orchestrator:
    paths: [utils/orchestrator/]
    carryforward: true

  # ── Next.js dashboard (uploaded by nextjs_dash_quality.yml) ──────────
  nextjs-dash-node:
    paths: [utils/nextjs-dash/lib/, utils/nextjs-dash/app/api/, utils/nextjs-dash/scripts/sse-smoke.mjs]
    carryforward: true
  nextjs-dash-dom:
    paths: [utils/nextjs-dash/app/components/, utils/nextjs-dash/app/hooks/, utils/nextjs-dash/app/theme.ts, utils/nextjs-dash/app/themeOptions.ts, utils/nextjs-dash/app/Providers.tsx]
    carryforward: true

  # ── Go services (uploaded by go_coverage.yml) ──────────────────────
  go-enhanced:
    paths: [services/go/enhanced/]
    carryforward: true
  go-simple:
    paths: [services/go/simple/]
    carryforward: true

  # ── Python services (uploaded by django_python_coverage.yml) ────────
  python-django-platform:
    paths: [services/python/django/gunicorn/WSGI/, services/python/django/gunicorn/common/src/]
    carryforward: true
  python-django-reactive:
    paths: [services/python/django/gunicorn/ASGI/, services/python/django/gunicorn/common/src/]
    carryforward: true

  # ── CI tooling (uploaded by sonar.yml) ────────────────────────────────
  ci-tooling:
    paths:
      - scripts/
      - integration-tests/results.py
      - services/python/django/gunicorn/sync_build_locks.py
      - utils/nextjs-dash/scripts/coverage-gate.mjs
      - utils/orchestrator/scripts/direct-sse-smoke.mjs

# ── Component definitions ─────────────────────────────────────────────
# Components aggregate flags into language-level groups.  The Codecov
# dashboard shows per-component coverage trends and PR diffs.

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        informational: true
  individual_components:
    - component_id: java_services
      name: Java Services
      paths:
        - services/java/**
        - utils/orchestrator/**
    - component_id: nextjs_dashboard
      name: Next.js Dashboard
      paths:
        - utils/nextjs-dash/**
    - component_id: go_services
      name: Go Services
      paths:
        - services/go/**
    - component_id: python_services
      name: Python Services
      paths:
        - services/python/**

# ── Ignored paths ─────────────────────────────────────────────────────
ignore:
  # Shared with sonar.coverage.exclusions in sonar-project.properties.
  # Generated landing page. Its authored template remains in scope.
  - "docs/index.html"
  # Docs navigation uses browser layout for responsive overflow.
  - "docs/assets/js/navigation.js"
  # Platform bootstrap, isolated checker fixtures, and compatibility launcher.
  - ".github/requirements/python-ci.ps1"
  - "scripts/capture-check.mjs"
  - "scripts/sync-framework-versions.mjs"
  # Identical native OpenTelemetry compatibility shims.
  - "services/java/spring/native/netty/src/main/java/io/opentelemetry/api/internal/InstrumentationUtil.java"
  - "services/java/spring/native/tomcat/src/main/java/io/opentelemetry/api/internal/InstrumentationUtil.java"
  # Helidon MP native-image substitutions and build-time feature.
  - "services/java/helidon/mp/native/src/main/java/io/github/georgecodes/benchmarking/helidon/mp/graalvm/WeldEventPreloaderSubstitution.java"
  - "services/java/helidon/mp/native/src/main/java/io/github/georgecodes/benchmarking/helidon/mp/graalvm/WeldExecutorSubstitution.java"
  - "services/java/helidon/mp/native/src/main/java/io/github/georgecodes/benchmarking/helidon/mp/graalvm/WeldProxyBuildTimeInitFeature.java"
  # Framework launchers and the JAX-RS resource-root declaration.
  - "services/java/spring/jvm/netty/src/main/java/io/github/georgecodes/benchmarking/spring/netty/NettyApplication.java"
  - "services/java/spring/jvm/tomcat/src/main/java/io/github/georgecodes/benchmarking/spring/tomcat/TomcatApplication.java"
  - "services/java/micronaut/jvm/src/main/java/io/github/georgecodes/benchmarking/micronaut/MicronautApplication.java"
  - "services/java/helidon/mp/jvm/src/main/java/io/github/georgecodes/benchmarking/helidon/mp/web/HelloApplication.java"
  - "services/java/dropwizard/jvm/src/main/java/io/github/georgecodes/benchmarking/dropwizard/DropwizardApplication.java"
  - "services/java/helidon/se/jvm/src/main/java/io/github/georgecodes/benchmarking/helidon/se/HelidonApplication.java"
  - "services/java/javalin/jvm/src/main/java/io/github/georgecodes/benchmarking/javalin/JavalinApplication.java"
  - "services/java/pekko/jvm/src/main/java/io/github/georgecodes/benchmarking/pekko/PekkoApplication.java"
  - "services/java/spark/jvm/src/main/java/io/github/georgecodes/benchmarking/spark/SparkApplication.java"
  - "services/java/vertx/jvm/src/main/java/io/github/georgecodes/benchmarking/vertx/VertxApplication.java"
  # Metrics providers and JVM metrics configuration excluded by JaCoCo.
  - "services/java/dropwizard/jvm/src/main/java/io/github/georgecodes/benchmarking/dropwizard/infra/MetricsProvider.java"
  - "services/java/javalin/jvm/src/main/java/io/github/georgecodes/benchmarking/javalin/infra/MetricsProvider.java"
  - "services/java/pekko/jvm/src/main/java/io/github/georgecodes/benchmarking/pekko/infra/MetricsProvider.java"
  - "services/java/spark/jvm/src/main/java/io/github/georgecodes/benchmarking/spark/infra/MetricsProvider.java"
  - "services/java/vertx/jvm/src/main/java/io/github/georgecodes/benchmarking/vertx/infra/MetricsProvider.java"
  - "services/java/helidon/mp/jvm/src/main/java/io/github/georgecodes/benchmarking/helidon/mp/infra/metrics/JvmExtrasMetricsConfiguration.java"
  - "services/java/helidon/se/jvm/src/main/java/io/github/georgecodes/benchmarking/helidon/se/infra/metrics/JvmExtrasMetricsConfiguration.java"
  - "services/java/micronaut/jvm/src/main/java/io/github/georgecodes/benchmarking/micronaut/infra/metrics/JvmExtrasMetricsConfiguration.java"
  - "services/java/quarkus/jvm/src/main/java/io/github/georgecodes/benchmarking/quarkus/infra/metrics/JvmExtrasMetricsConfiguration.java"
  # Build-time checker run directly from Java source.
  - "utils/orchestrator/quality/CompactConstructorJavadocParamCheck.java"
  # Dashboard build settings and shared type definitions.
  - "utils/nextjs-dash/next.config.ts"
  - "utils/nextjs-dash/app/layout.tsx"
  - "utils/nextjs-dash/lib/loggingTypes.ts"
  - "utils/nextjs-dash/lib/runtimeConfigTypes.ts"

  # Test sources are classified separately in Sonar.
  - "utils/nextjs-dash/__tests__/**"
  - "services/python/**/tests/**"
