name: Go Coverage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/go/**'
      - '.github/workflows/go_coverage.yml'
      - 'scripts/coverage_gate.py'
      - 'scripts/coverage-thresholds.json'
      - 'scripts/test_coverage_gate.py'
      - 'scripts/coverage_summary.py'
      - 'scripts/test_coverage_summary.py'
      - '.github/actions/setup-go/**'
      - '.github/actions/codecov-upload/**'
      - '.github/actions/upload-artifact/**'
  push:
    branches:
      - main
    paths:
      - 'services/go/**'
      - '.github/workflows/go_coverage.yml'
      - 'scripts/coverage_gate.py'
      - 'scripts/coverage-thresholds.json'
      - 'scripts/test_coverage_gate.py'
      - 'scripts/coverage_summary.py'
      - 'scripts/test_coverage_summary.py'
      - '.github/actions/setup-go/**'
      - '.github/actions/codecov-upload/**'
      - '.github/actions/upload-artifact/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go-enhanced
            module_dir: services/go/enhanced
          - name: go-simple
            module_dir: services/go/simple
    defaults:
      run:
        working-directory: ${{ matrix.module_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version-file: ${{ matrix.module_dir }}/go.mod
          cache-dependency-path: |
            ${{ matrix.module_dir }}/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Check go.mod tidiness
        run: |
          go mod tidy -diff
          git diff --exit-code go.mod go.sum || {
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit the result."
            exit 1
          }

      - name: Run tests with coverage
        id: test
        run: |
          go test ./... -race -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic

      # ── Parse coverage and write GitHub Step Summary ──────────────
      - name: Enforce module coverage thresholds
        if: always() && !cancelled()
        env:
          MODULE_NAME: ${{ matrix.name }}
        run: python3 "$GITHUB_WORKSPACE/scripts/coverage_gate.py" "$MODULE_NAME"

      - name: Generate coverage summary
        if: always() && !cancelled()
        env:
          MODULE_NAME: ${{ matrix.name }}
          MODULE_DIR: ${{ matrix.module_dir }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: python3 "$GITHUB_WORKSPACE/scripts/coverage_summary.py" go

      # ── Generate HTML coverage report ────────────────────────────
      - name: Generate HTML coverage report
        if: always() && !cancelled() && steps.test.outcome == 'success'
        run: go tool cover -html=coverage.out -o coverage.html

      # ── Upload coverage artifacts ────────────────────────────────
      - name: Upload coverage report
        if: always() && !cancelled()
        uses: ./.github/actions/upload-artifact
        with:
          name: coverage-${{ matrix.name }}
          path: |
            ${{ matrix.module_dir }}/coverage.out
            ${{ matrix.module_dir }}/coverage.html
          retention-days: 30
          if-no-files-found: warn

      # ── Fix coverage paths for Codecov ──────────────────────────
      # Go coverage profiles use the module name as the path prefix
      # (e.g. "hello/cmd/server/main.go"), but Codecov needs paths
      # relative to the repository root (e.g. "services/go/simple/
      # cmd/server/main.go").  This step rewrites the prefix so
      # Codecov can match coverage data to source files.
      - name: Fix coverage paths for Codecov
        if: always() && !cancelled() && steps.test.outcome == 'success'
        env:
          MODULE_DIR: ${{ matrix.module_dir }}
        run: |
          go_module="$(head -1 go.mod | awk '{print $2}')"
          echo "Rewriting coverage paths: ${go_module}/ → ${MODULE_DIR}/"
          sed "s|${go_module}/|${MODULE_DIR}/|g" coverage.out > coverage-codecov.out

      # ── Codecov upload ───────────────────────────────────────────
      # Upload Go coverage using the standard coverage.out format.
      # Codecov natively supports Go coverage profiles.
      #
      # Flag naming: go-{module} (e.g., go-enhanced, go-simple).
      # See codecov.yml at the repo root for flag → path mappings
      # and component definitions.
      - name: Upload to Codecov
        if: always() && !cancelled() && steps.test.outcome == 'success'
        uses: ./.github/actions/codecov-upload
        with:
          files: ${{ matrix.module_dir }}/coverage-codecov.out
          flags: ${{ matrix.name }}
          name: ${{ matrix.name }}
          token: ${{ secrets.CODECOV_TOKEN }}
