name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - '.github/actions/upload-pages-artifact/**'
      - '.github/actions/upload-artifact/**'
      - '.github/actions/download-artifact/**'
      - '.github/actions/cache/**'
      - 'scripts/pages/**'
  # Only trusted main code executes; same-repository artifacts are data.
  # Reassess this scoped exception if checkout refs or artifact execution change.
  workflow_run: # zizmor: ignore[dangerous-triggers] trusted-main checkout, read-only collection, isolated deploy job
    workflows: [Qodana, Next.js Dashboard Quality, Django Python Quality, Go Quality, CodeQL]
    types: [completed]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  inventory:
    if: >-
      github.event_name != 'workflow_run' ||
      (contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion) &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      producers: ${{ steps.catalog.outputs.producers }}
      source_sha: ${{ steps.checkout.outputs.commit }}
    steps:
      - name: Checkout trusted site source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Load report catalog
        id: catalog
        run: |
          producers="$(node scripts/pages/github-reports.mjs matrix)"
          echo "producers=$producers" >> "$GITHUB_OUTPUT"

  docs:
    needs: inventory
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout trusted site source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; NOSONAR - reviewed S7631: trusted main, never fork code; scripts/quality/sonar-exceptions.md
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Verify trusted source revision
        env:
          EXPECTED_SHA: ${{ needs.inventory.outputs.source_sha }}
          CHECKED_OUT_SHA: ${{ steps.checkout.outputs.commit }}
        run: test "$CHECKED_OUT_SHA" = "$EXPECTED_SHA"
      - name: Restore compiled documentation
        id: site-cache
        uses: ./.github/actions/cache
        with:
          path: _site
          key: jekyll-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('docs/**', '.github/workflows/pages.yml') }}
          # workflow_run has read-only cache access; push/manual runs populate it.
          restore-only: ${{ github.event_name == 'workflow_run' }}
      - name: Set up Ruby
        if: steps.site-cache.outputs.cache-hit != 'true'
        uses: ruby/setup-ruby@4e97ecde5048e1e0816923020652678063ffbf65 # v1.339.0
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
          working-directory: ./docs
      - name: Build site with Bundler and Jekyll
        if: steps.site-cache.outputs.cache-hit != 'true'
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: |
          test -f Gemfile.lock
          bundle exec jekyll build --destination ../_site
      - name: Upload base site
        uses: ./.github/actions/upload-artifact
        with:
          name: pages-base-site
          path: _site/
          retention-days: 1
          if-no-files-found: error

  collect:
    needs: inventory
    name: Collect ${{ matrix.scope }} / ${{ matrix.producer.id }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        scope: [live, stage]
        producer: ${{ fromJSON(needs.inventory.outputs.producers) }}
    steps:
      - name: Checkout trusted site source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; NOSONAR - reviewed S7631: trusted main, never fork code; scripts/quality/sonar-exceptions.md
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Verify trusted source revision
        env:
          EXPECTED_SHA: ${{ needs.inventory.outputs.source_sha }}
          CHECKED_OUT_SHA: ${{ steps.checkout.outputs.commit }}
        run: test "$CHECKED_OUT_SHA" = "$EXPECTED_SHA"
      - name: Resolve freshest eligible source
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_PRODUCER: ${{ matrix.producer.producer }}
          REPORT_ARTIFACT: ${{ matrix.producer.report }}
          REPORT_SCOPE: ${{ matrix.scope }}
        run: node scripts/pages/github-reports.mjs collect
      - name: Download producer reports
        id: download
        if: steps.source.outputs.run_id != ''
        # Missing diagnostics are represented explicitly by assembly.
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          pattern: ${{ matrix.producer.pattern }}
          path: .collected/
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: false
      - name: Record download outcome
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: node scripts/pages/github-reports.mjs finish
      - name: Upload report collection
        uses: ./.github/actions/upload-artifact
        with:
          name: collection-${{ matrix.scope }}-${{ matrix.producer.id }}
          path: .collected/
          # The staging directory is hidden, including its required source.json.
          include-hidden-files: 'true'
          retention-days: 1
          if-no-files-found: error

  build:
    needs: [inventory, docs, collect]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted site source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; NOSONAR - reviewed S7631: trusted main, never fork code; scripts/quality/sonar-exceptions.md
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Verify trusted source revision
        env:
          EXPECTED_SHA: ${{ needs.inventory.outputs.source_sha }}
          CHECKED_OUT_SHA: ${{ steps.checkout.outputs.commit }}
        run: test "$CHECKED_OUT_SHA" = "$EXPECTED_SHA"
      - name: Download compiled documentation
        uses: ./.github/actions/download-artifact
        with:
          name: pages-base-site
          path: _site/
      - name: Download report collections
        uses: ./.github/actions/download-artifact
        with:
          pattern: collection-*
          path: .collections/
          merge-multiple: false
      - name: Assemble report scopes and provenance
        run: node scripts/pages/assemble-reports.mjs
      - name: Upload Pages Artifact
        uses: ./.github/actions/upload-pages-artifact

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
