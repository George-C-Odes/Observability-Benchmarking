name: Semgrep
description: Run semgrep ci against Semgrep AppSec Platform policies without exporting output into the job environment.

# The caller supplies SEMGREP_APP_TOKEN through the step environment only.
# Docker actions receive GITHUB_* context and the event payload automatically,
# which semgrep ci uses for diff-aware pull request scans.
inputs:
  sarif-output:
    description: SARIF report path, relative to the workspace.
    required: true

runs:
  using: docker
  image: Dockerfile
  args:
    - ci
    # Fail closed on scanner and platform errors instead of the default exit 0.
    - --no-suppress-errors
    # Renovate merges every matching packageRules entry, so the registry-wide
    # minimumReleaseAge rule in renovate.json already covers each entry. This
    # registry rule checks entries in isolation (and wants 7 days), so it only
    # produces false positives here. It targets Renovate configs alone.
    - --exclude-rule=package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age
    - --sarif-output=${{ inputs.sarif-output }}
