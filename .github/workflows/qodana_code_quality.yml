name: Qodana

on:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'
  # Route inside the workflow so unchanged scopes retain their existing checks.
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'services/java/**'
      - 'utils/orchestrator/**'
      - '.github/workflows/qodana_code_quality.yml'
      - 'scripts/qodana-cli-asset*.mjs'
      - 'scripts/qodana-scopes*.mjs'
      - 'scripts/changed-paths*.mjs'
      - 'scripts/qodana-project*.mjs'
      - 'scripts/github-release-asset*.mjs'
      - '.github/qodana-cli-lock.json'
      - '.github/actions/upload-artifact/**'
      - 'qodana.yaml'
      - '.idea/misc.xml'
      - '.qodana/baseline/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      services-java: ${{ steps.scopes.outputs.services-java }}
      orchestrator: ${{ steps.scopes.outputs.orchestrator }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select affected Java scopes
        id: scopes
        run: node scripts/qodana-scopes.mjs

  qodana:
    needs: changes
    if: always() && !cancelled()
    permissions:
      contents: read
      checks: write
    name: Qodana (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SCAN_ENABLED: ${{ needs.changes.outputs[matrix.name] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `services/java` is analyzed as one scoped Qodana job, but the shared
          # bootstrap in `qodana.yaml` compiles every Maven module under that
          # tree so symbol resolution works across all Java service variants.
          - name: services-java
            source_dir: services/java
            baseline_file: .qodana/baseline/services-java.sarif.json
          - name: orchestrator
            source_dir: utils/orchestrator
            baseline_file: .qodana/baseline/orchestrator.sarif.json
    steps:
      - name: Record unaffected scope
        if: env.SCAN_ENABLED == 'false'
        run: echo 'No analysis inputs changed for this scope; Qodana scan skipped.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require valid scope selection
        if: env.SCAN_ENABLED != 'true' && env.SCAN_ENABLED != 'false'
        run: exit 1
      - name: Checkout
        if: env.SCAN_ENABLED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test Qodana CLI release lookup
        if: env.SCAN_ENABLED == 'true'
        run: node --test scripts/qodana-cli-asset.test.mjs scripts/github-release-asset.test.mjs

      - name: Install Qodana CLI
        if: env.SCAN_ENABLED == 'true'
        timeout-minutes: 10
        shell: bash
        env:
          # Pin the CLI independently; verify the archive before installing it.
          # Refresh .github/qodana-cli-lock.json for offline asset lookup when
          # bumping these pins. Other versions use bounded live metadata lookup.
          QODANA_CLI_VERSION: '2026.2.3'
          QODANA_CLI_SHA256: '86554e8ac62f65009245211baf56b184d0f57df86dbcddd54fbffcd6dc0cfe96'
        run: |
          download_qodana() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 10 --retry-max-time 120 \
              --connect-timeout 15 --max-time 120 \
              --proto '=https' --proto-redir '=https' \
              --header 'Accept: application/octet-stream' \
              --output "$RUNNER_TEMP/qodana-cli.tar.gz" "$1"
          }
          if ! download_qodana "https://github.com/JetBrains/qodana-cli/releases/download/v${QODANA_CLI_VERSION}/qodana_linux_x86_64.tar.gz"; then
            echo '::warning::Qodana CLI release download failed; trying the public release-asset API.'
            # Resolve the exact version, never reuse an older release's asset ID.
            asset_url="$(node scripts/qodana-cli-asset.mjs "$QODANA_CLI_VERSION" "$QODANA_CLI_SHA256")"
            download_qodana "$asset_url"
          fi
          printf '%s  %s\n' "$QODANA_CLI_SHA256" "$RUNNER_TEMP/qodana-cli.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/qodana-cli"
          tar -xzf "$RUNNER_TEMP/qodana-cli.tar.gz" -C "$RUNNER_TEMP/qodana-cli" qodana
          chmod +x "$RUNNER_TEMP/qodana-cli/qodana"
          echo "$RUNNER_TEMP/qodana-cli" >> "$GITHUB_PATH"

      - name: Prepare Qodana arguments
        if: env.SCAN_ENABLED == 'true'
        id: qodana_args
        shell: bash
        env:
          SOURCE_DIR: ${{ matrix.source_dir }}
          BASELINE_FILE: ${{ matrix.baseline_file }}
        run: |
          args="--project-dir=. --only-directory=$SOURCE_DIR"

          if [[ -f "$BASELINE_FILE" ]]; then
            echo "Using Qodana baseline: $BASELINE_FILE"
            args="$args --baseline=$BASELINE_FILE"
          else
            echo "No Qodana baseline found at $BASELINE_FILE; running without a baseline."
          fi

          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Scope Maven project import
        if: env.SCAN_ENABLED == 'true'
        env:
          SOURCE_DIR: ${{ matrix.source_dir }}
        run: node scripts/qodana-project.mjs "$SOURCE_DIR"
      - name: Qodana Scan
        if: env.SCAN_ENABLED == 'true'
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        env:
          # Qodana's startup path loads JNA on JDK 25+, which emits a native
          # access warning unless the JVM explicitly allows unnamed modules.
          # Netty also touches sun.misc.Unsafe during startup on newer JDKs, so
          # allow that compatibility mode as well to reduce JVM warning noise.
          JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
          QODANA_ONLY_DIRECTORY: ${{ matrix.source_dir }}
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          use-installed-cli: true
          pr-mode: false
          use-caches: true
          # Prefer the default branch cache so PRs can reuse warm Qodana/Maven
          # caches instead of creating mostly one-off branch-specific entries.
          cache-default-branch-only: true
          # Isolate the two projects and invalidate on analyzer/profile/POM changes.
          # The restore prefix also finds warm main caches from PR merge refs.
          primary-cache-key: qodana-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles('qodana.yaml', '.idea/misc.xml', '.github/workflows/qodana_code_quality.yml', '.qodana/baseline/qodana-settings.xml', format('{0}/**/pom.xml', matrix.source_dir), 'services/java/quarkus/native/mvnw', 'services/java/quarkus/native/.mvn/**') }}-${{ github.sha }}
          additional-cache-key: qodana-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles('qodana.yaml', '.idea/misc.xml', '.github/workflows/qodana_code_quality.yml', '.qodana/baseline/qodana-settings.xml', format('{0}/**/pom.xml', matrix.source_dir), 'services/java/quarkus/native/mvnw', 'services/java/quarkus/native/.mvn/**') }}-
          env-vars-to-linter: QODANA_ONLY_DIRECTORY,JAVA_TOOL_OPTIONS
          post-pr-comment: false
          use-annotations: true
          # The Qodana action pre-zips results before uploading, which makes
          # the artifact incompatible with download-artifact@v4+ (the Pages
          # workflow gets a nested ZIP instead of extracted files).  We keep
          # upload-result for full SARIF/log access under a distinct name and
          # add an explicit upload-artifact step below for the HTML report.
          upload-result: true
          artifact-name: qodana-results-${{ matrix.name }}
          results-dir: ${{ runner.temp }}/qodana/results
          push-fixes: 'none'
          args: ${{ steps.qodana_args.outputs.args }}

      # Explicit upload of the HTML report directory using upload-artifact@v4
      # so that the Pages workflow's download-artifact@v8.0.2 receives extracted
      # files (not the nested ZIP that the Qodana action produces).
      - name: Upload Qodana HTML report
        if: always() && !cancelled() && env.SCAN_ENABLED == 'true'
        uses: ./.github/actions/upload-artifact
        with:
          name: qodana-report-${{ matrix.name }}
          path: ${{ runner.temp }}/qodana/results/report/
          retention-days: 30
          if-no-files-found: warn
