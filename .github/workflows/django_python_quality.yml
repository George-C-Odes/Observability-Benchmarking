name: Django Python Quality

env:
  # TODO(node24-migration): Remove once GitHub's default action runtime is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/python/django/**'
      - '.github/workflows/django_python_quality.yml'
      - '.github/actions/setup-python/**'
      - '.github/actions/install-python-dependencies/**'
      - '.github/requirements/**'
      - '.github/actions/upload-artifact/**'
      - 'scripts/*qodana*'
  push:
    branches:
      - main
    paths:
      - 'services/python/django/**'
      - '.github/workflows/django_python_quality.yml'
      - '.github/actions/setup-python/**'
      - '.github/actions/install-python-dependencies/**'
      - '.github/requirements/**'
      - '.github/actions/upload-artifact/**'
      - 'scripts/*qodana*'
  schedule:
    # Weekly scan — Monday at 06:30 UTC (staggered after Next.js at 06:15).
    - cron: '30 6 * * 1'

permissions:
  contents: read

jobs:
  common:
    name: Django common checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          cache: pip
          cache-dependency-path: |
            .github/requirements/**
            services/python/django/gunicorn/common/pyproject.toml
            services/python/django/gunicorn/WSGI/requirements-dev.txt

      - name: Install dependencies
        uses: ./.github/actions/install-python-dependencies
        with:
          requirements: services/python/django/gunicorn/WSGI/requirements-dev.txt

      - name: Check Docker dependency locks
        run: |
          python services/python/django/gunicorn/sync_build_locks.py --check
          python -m unittest discover -s services/python/django/gunicorn -p test_sync_build_locks.py -v
          python -m ruff check --config services/python/django/gunicorn/common/pyproject.toml services/python/django/gunicorn/*.py
          python -m ruff format --check --config services/python/django/gunicorn/common/pyproject.toml services/python/django/gunicorn/*.py

      - name: Check Qodana helpers
        run: |
          python -m unittest discover -s scripts -p test_qodana_python.py -v
          python -m ruff check --config services/python/django/gunicorn/common/pyproject.toml scripts/run-qodana-python.py scripts/qodana-python-report.py scripts/test_qodana_python.py
          python -m ruff format --check --config services/python/django/gunicorn/common/pyproject.toml scripts/run-qodana-python.py scripts/qodana-python-report.py scripts/test_qodana_python.py

      - name: Syntax check
        working-directory: services/python/django/gunicorn/common
        run: python -m compileall src

      - name: Print Ruff version
        working-directory: services/python/django/gunicorn/common
        run: python -m ruff --version

      - name: Lint
        working-directory: services/python/django/gunicorn/common
        run: python -m ruff check .

      - name: Format check
        working-directory: services/python/django/gunicorn/common
        run: python -m ruff format --check .

  modules:
    name: Django module checks (${{ matrix.module_name }})
    needs: common
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      OTEL_SDK_DISABLED: 'true'
      PYROSCOPE_ENABLED: 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - module_name: django-platform
            module_dir: services/python/django/gunicorn/WSGI
          - module_name: django-reactive
            module_dir: services/python/django/gunicorn/ASGI
    defaults:
      run:
        working-directory: ${{ matrix.module_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: ./.github/actions/setup-python
        with:
          cache: pip
          cache-dependency-path: |
            .github/requirements/**
            services/python/django/gunicorn/common/pyproject.toml
            ${{ matrix.module_dir }}/requirements.txt
            ${{ matrix.module_dir }}/requirements-dev.txt

      - name: Install dependencies
        uses: ./.github/actions/install-python-dependencies
        with:
          requirements: |
            ${{ matrix.module_dir }}/requirements.txt
            ${{ matrix.module_dir }}/requirements-dev.txt
          local-project: services/python/django/gunicorn/common

      - name: Syntax check
        run: python -m compileall manage.py hello_project gunicorn.conf.py

      - name: Print Ruff version
        run: python -m ruff --version

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Django system checks
        run: python manage.py check

      - name: Unit tests
        run: python manage.py test obbench_django_common.tests --verbosity=2

  qodana:
    name: Qodana Python (Django)
    # Collect semantic diagnostics even when common lint checks fail.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      RESULTS_DIR: ${{ runner.temp }}/qodana-python/results
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Qodana Python Community Scan
        run: python scripts/run-qodana-python.py --results-dir "$RESULTS_DIR"

      - name: Verify inspection coverage and publish summary
        if: always() && !cancelled()
        run: python scripts/qodana-python-report.py "$RESULTS_DIR" >> "$GITHUB_STEP_SUMMARY"

      # Explicit upload of the HTML report directory so the Pages workflow
      # can download and host it alongside the JVM and Next.js reports.
      - name: Upload Qodana HTML report
        if: always() && !cancelled()
        uses: ./.github/actions/upload-artifact
        with:
          name: qodana-report-django-python
          path: ${{ runner.temp }}/qodana-python/results/report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload Qodana diagnostics
        if: always() && !cancelled()
        uses: ./.github/actions/upload-artifact
        with:
          name: qodana-diagnostics-django-python
          path: |
            ${{ runner.temp }}/qodana-python/results/scan.log
            ${{ runner.temp }}/qodana-python/results/log/
            ${{ runner.temp }}/qodana-python/results/projectStructure/
            ${{ runner.temp }}/qodana-python/results/qodana.sarif.json
            ${{ runner.temp }}/qodana-python/results/inspection-summary.*
          retention-days: 30
          if-no-files-found: warn
