name: Snyk Security

env:
  # TODO(node24-migration): Remove once GitHub's default action runtime is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

concurrency:
  group: snyk-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk Security Scan
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check SNYK_TOKEN secret
        if: env.SNYK_TOKEN == ''
        run: |
          echo "::warning::SNYK_TOKEN secret is not configured in GitHub repository secrets. Snyk scans will be skipped."
          echo "To enable Snyk scans:"
          echo "  1. Sign in to https://app.snyk.io"
          echo "  2. Go to Account Settings -> API Token (or https://app.snyk.io/account)"
          echo "  3. Copy your API token"
          echo "  4. Add the secret to GitHub: Settings -> Secrets and variables -> Actions -> 'SNYK_TOKEN'"

      - name: Set up Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Set up JDK 25
        if: env.SNYK_TOKEN != ''
        uses: ./.github/actions/setup-java
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            services/java/**/pom.xml
            utils/orchestrator/pom.xml

      - name: Set up Python
        if: env.SNYK_TOKEN != ''
        uses: ./.github/actions/setup-python
        with:
          cache: pip
          cache-dependency-path: |
            .github/requirements/**
            services/python/django/gunicorn/*/requirements.txt

      - name: Set up Go
        if: env.SNYK_TOKEN != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/go/enhanced/go.mod
          cache-dependency-path: |
            services/go/**/go.sum
            .github/go-tools/go.sum

      - name: Set up Node.js
        if: env.SNYK_TOKEN != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - name: Test Snyk scan runner
        if: env.SNYK_TOKEN != ''
        run: node --test scripts/snyk-scan.test.mjs scripts/snyk-report.test.mjs

      - name: Prepare dependency resolution
        if: env.SNYK_TOKEN != ''
        shell: bash
        run: |
          # Snyk invokes native modules' Maven wrappers directly on Linux.
          # These scripts are stored without executable permission in Git.
          find services/java -type f -name mvnw -exec chmod +x {} +
          snyk --version
          java -version
          mvn --version
          python --version
          go version
          node --version

      # Snyk needs installed packages to resolve Python's transitive dependencies.
      - name: Install Python dependencies
        if: env.SNYK_TOKEN != ''
        uses: ./.github/actions/install-python-dependencies
        with:
          requirements: |
            services/python/django/gunicorn/WSGI/requirements.txt
            services/python/django/gunicorn/ASGI/requirements.txt

      # Runs Snyk Code (SAST) analysis and exports SARIF for GitHub Code Scanning.
      # Findings are warnings; continue-on-error also lets uploads run after scan errors.
      - name: Snyk Code test
        if: env.SNYK_TOKEN != ''
        id: snyk-code
        continue-on-error: true
        shell: bash
        run: node scripts/snyk-scan.mjs code || test "$?" -eq 1

      # Runs Snyk Open Source (SCA) analysis. The test command reports findings
      # through its exit code; the gate warns on findings but fails on scan errors.
      # Unresolved projects fail closed, not silently skipped.
      - name: Snyk Open Source test
        if: env.SNYK_TOKEN != ''
        id: snyk-open-source-test
        continue-on-error: true
        shell: bash
        run: node scripts/snyk-scan.mjs test || test "$?" -eq 1

      # PRs must not overwrite the trusted main dependency snapshot in Snyk.
      # Monitor's exit code only indicates whether the snapshot upload succeeded.
      - name: Snyk Open Source monitor
        if: env.SNYK_TOKEN != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: snyk-open-source-monitor
        continue-on-error: true
        run: node scripts/snyk-scan.mjs monitor

      # Snyk IaC does not support Docker Compose. This repository currently has
      # no supported IaC manifests (e.g. Terraform, Kubernetes or CloudFormation).
      # Add a scan scoped to those manifests when they are introduced, rather
      # than recursively parsing Compose and application YAML from the root.

      - name: Upload Snyk Code results to GitHub Code Scanning
        if: always() && !cancelled() && hashFiles('snyk-results/code.sarif') != ''
        uses: ./.github/actions/codeql-action
        with:
          phase: upload-sarif
          sarif_file: snyk-results/code.sarif
          category: snyk-code

      # The runner consolidates per-project runs for GitHub's single-run/category
      # requirement. The original test.sarif remains in the diagnostics artifact.
      - name: Upload Snyk Open Source results to GitHub Code Scanning
        if: always() && !cancelled() && hashFiles('snyk-results/test-github.sarif') != ''
        uses: ./.github/actions/codeql-action
        with:
          phase: upload-sarif
          sarif_file: snyk-results/test-github.sarif
          category: snyk-open-source

      - name: Retain Snyk diagnostics
        if: always() && !cancelled() && hashFiles('snyk-results/**') != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: snyk-results
          path: snyk-results/
          retention-days: 14

      - name: Enforce Snyk security gate
        if: always() && !cancelled()
        shell: bash
        env:
          CODE_OUTCOME: ${{ steps.snyk-code.outcome }}
          TEST_OUTCOME: ${{ steps.snyk-open-source-test.outcome }}
          MONITOR_OUTCOME: ${{ steps.snyk-open-source-monitor.outcome }}
          CODE_RESULT: ${{ steps.snyk-code.outputs.result }}
          TEST_RESULT: ${{ steps.snyk-open-source-test.outputs.result }}
          MONITOR_RESULT: ${{ steps.snyk-open-source-monitor.outputs.result }}
        run: |
          if [[ -z "$SNYK_TOKEN" ]]; then
            echo 'Snyk scans skipped: no SNYK_TOKEN is available.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Code: ${CODE_RESULT:-not completed}; dependencies: ${TEST_RESULT:-not completed}; monitor: ${MONITOR_RESULT:-skipped}."
          {
            echo '### Snyk security gate'
            echo
            echo '| Scan | Result | Step outcome |'
            echo '| --- | --- | --- |'
            echo "| Code | ${CODE_RESULT:-not completed} | ${CODE_OUTCOME:-not completed} |"
            echo "| Dependencies | ${TEST_RESULT:-not completed} | ${TEST_OUTCOME:-not completed} |"
            echo "| Monitor | ${MONITOR_RESULT:-skipped} | ${MONITOR_OUTCOME:-skipped} |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # Exit 1 means findings for code/test, not an incomplete scan.
          # Scan steps normalize that exit code; missing outputs still fail closed.
          scan_completed() {
            [[ "$2" == "success" && ( "$1" == "clean" || "$1" == "findings" ) ]]
          }
          if ! scan_completed "$CODE_RESULT" "$CODE_OUTCOME" || \
             ! scan_completed "$TEST_RESULT" "$TEST_OUTCOME" || \
             [[ "$MONITOR_OUTCOME" == "failure" ]]; then
            # The scan runner already emitted an actionable findings/error
            # annotation. Do not repeat it with a generic custom annotation.
            echo 'Security gate blocked: incomplete scan or failed monitor upload. See the snyk-results artifact.'
            echo '**Blocked:** incomplete scan or failed monitor upload. See the scan overviews and snyk-results artifact for details.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$CODE_RESULT" == "findings" || "$TEST_RESULT" == "findings" ]]; then
            echo 'Security findings reported as warnings; the job check remains successful.'
            echo '**Warning:** required scans completed with security findings (non-blocking). See the findings overviews and Code Scanning for details.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**Passed:** required scans completed without findings.' >> "$GITHUB_STEP_SUMMARY"
          fi
