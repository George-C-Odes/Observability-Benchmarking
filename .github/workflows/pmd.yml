name: pmd

env:
  # TODO(node24-migration): Remove once GitHub's default action runtime is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'utils/**'
      - '.github/workflows/pmd.yml'
      - '.github/actions/setup-java/**'
      - '.github/actions/codeql-action/**'
      - '.github/actions/upload-artifact/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'utils/**'
      - '.github/workflows/pmd.yml'
      - '.github/actions/setup-java/**'
      - '.github/actions/codeql-action/**'
      - '.github/actions/upload-artifact/**'
  workflow_dispatch:
  schedule:
    - cron: '29 23 * * 6'

permissions:
  contents: read

jobs:
  pmd-code-scan:
    name: PMD Code Scan
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: ./.github/actions/setup-java
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install PMD
        shell: bash
        env:
          PMD_VERSION: '7.28.0'
          PMD_SHA256: 'f974ba571f7bc01c73fffe11bade25fbc1f438698f9e9c00e416e8d65e9fbac2'
        run: |
          # Use the CLI because pmd/pmd-github-action still declares Node 20.
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/pmd.zip" \
            "https://github.com/pmd/pmd/releases/download/pmd_releases/${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
          printf '%s  %s\n' "$PMD_SHA256" "$RUNNER_TEMP/pmd.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/pmd.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pmd-bin-${PMD_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Run PMD
        shell: bash
        run: |
          # PMD fails by default on violations and analysis errors.
          pmd check \
            --dir utils \
            --rulesets rulesets/java/quickstart.xml \
            --format sarif \
            --report-file pmd-report.sarif

      - name: Upload PMD report artifact
        if: always() && hashFiles('pmd-report.sarif') != ''
        uses: ./.github/actions/upload-artifact
        with:
          name: PMD Report
          path: pmd-report.sarif
          if-no-files-found: error

      - name: Upload SARIF file
        if: always() && hashFiles('pmd-report.sarif') != ''
        uses: ./.github/actions/codeql-action
        with:
          phase: upload-sarif
          sarif_file: pmd-report.sarif
