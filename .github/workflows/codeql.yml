name: CodeQL

env:
  # Acknowledge the April 2026 default: skip file-coverage computation on
  # PRs for faster analysis.  Coverage is still computed on push, schedule,
  # and workflow_dispatch runs that feed the hosted quality report.
  CODEQL_ACTION_FILE_COVERAGE_ON_PRS: 'false'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'services/java/**'
      - 'services/python/**'
      - 'services/go/**'
      - 'utils/nextjs-dash/**'
      - 'utils/orchestrator/**'
      - 'scripts/pages/codeql-workflow.test.mjs'
      - 'scripts/pages/generate-codeql-report.mjs'
      - 'scripts/pages/report-helpers.mjs'
      - 'scripts/codeql-bundle*.mjs'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-java/**'
      - '.github/actions/setup-node/**'
      - '.github/actions/upload-artifact/**'
      - '.github/actions/download-artifact/**'
      - '.github/actions/codeql-action/**'
  push:
    branches:
      - main
    paths:
      - 'services/java/**'
      - 'utils/orchestrator/**'
      - 'services/python/**'
      - 'services/go/**'
      - 'utils/nextjs-dash/**'
      - 'scripts/pages/codeql-workflow.test.mjs'
      - 'scripts/pages/generate-codeql-report.mjs'
      - 'scripts/pages/report-helpers.mjs'
      - 'scripts/codeql-bundle*.mjs'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-java/**'
      - '.github/actions/setup-node/**'
      - '.github/actions/upload-artifact/**'
      - '.github/actions/download-artifact/**'
      - '.github/actions/codeql-action/**'
  schedule:
    # Weekly full scan — Monday at 05:30 UTC.
    # Scheduled runs ensure new CWE patterns and updated CodeQL query packs
    # are evaluated even when source code has not changed.
    - cron: '30 5 * * 1'

permissions: {}

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            # Compile to capture Lombok annotation processing and Quarkus
            # generated sources; do not switch to none just to enable overlays.
            build-mode: manual
          - language: python
            build-mode: none
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Java modules require JDK 25 (maven.compiler.release=25 across all
      # 12 JVM projects).  Maven dependency cache is seeded from the JVM
      # pom files only (native modules are excluded from CodeQL builds).
      - name: Set up JDK 25
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/setup-java
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: |
            services/java/**/jvm/**/pom.xml
            utils/orchestrator/pom.xml

      - name: Resolve CodeQL bundle
        id: bundle
        timeout-minutes: 5
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          node --test scripts/codeql-bundle.test.mjs
          node scripts/codeql-bundle.mjs "$CODEQL_LANGUAGE" >> "$GITHUB_OUTPUT"

      - name: Download CodeQL bundle
        timeout-minutes: 10
        shell: bash
        env:
          BUNDLE_URL: ${{ steps.bundle.outputs.download_url }}
          BUNDLE_API_URL: ${{ steps.bundle.outputs.api_url }}
          BUNDLE_SHA256: ${{ steps.bundle.outputs.sha256 }}
        run: |
          download_bundle() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 10 --retry-max-time 120 \
              --connect-timeout 15 --max-time 120 \
              --proto '=https' --proto-redir '=https' \
              --header 'Accept: application/octet-stream' \
              --output "$RUNNER_TEMP/codeql-bundle.tar.zst" "$1"
          }
          if ! download_bundle "$BUNDLE_URL"; then
            echo '::warning::CodeQL bundle download failed; trying the public release-asset API.'
            download_bundle "$BUNDLE_API_URL"
          fi
          printf '%s  %s\n' "$BUNDLE_SHA256" "$RUNNER_TEMP/codeql-bundle.tar.zst" | sha256sum --check --strict

      - name: Initialize CodeQL
        id: codeql-init
        uses: ./.github/actions/codeql-action
        env:
          # Java manual builds cannot use overlay databases. Explicitly select
          # the existing fresh-database fallback to avoid the PR warning without
          # changing extraction or the Maven dependency cache. An empty value
          # leaves the other languages' default overlay behavior unchanged.
          CODEQL_OVERLAY_DATABASE_MODE: ${{ matrix.language == 'java-kotlin' && 'none' || '' }}
        with:
          phase: init
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: ${{ runner.temp }}/codeql-bundle.tar.zst

      # ----------------------------------------------------------------
      # Java manual build
      #
      # • 12 JVM modules are compiled (11 services + orchestrator).
      # • 6 native-image modules are deliberately skipped — they are
      #   very slow, resource-heavy, and duplicate the source of their
      #   JVM counterparts (CodeQL already sees that code).
      # • Two-phase build:
      #   1. Compile with -Dcheckstyle.skip=true so CodeQL extraction
      #      always succeeds regardless of style violations.
      #   2. Run checkstyle:check separately; violations are logged as
      #      workflow warnings and the result is captured in a step
      #      output.  A later step (after SARIF upload) fails the job
      #      when violations exist.
      # • Every event builds all 12 modules. GitHub compares the same language
      #   category against main even on non-Java PRs, so skipping this leg
      #   produces a "configuration not found" warning.
      # • Fresh manual-build databases contain only this run's compiled modules;
      #   changed-module-only builds would leave incomplete security coverage.
      #   Keep the Maven dependency cache, not incremental source extraction.
      # ----------------------------------------------------------------
      - name: Build Java modules
        id: build-java
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail

          # ── Module registry (native modules deliberately excluded) ──
          SERVICE_MODULES=(
            services/java/spring/jvm/tomcat
            services/java/spring/jvm/netty
            services/java/quarkus/jvm
            services/java/micronaut/jvm
            services/java/helidon/se/jvm
            services/java/helidon/mp/jvm
            services/java/spark/jvm
            services/java/javalin/jvm
            services/java/dropwizard/jvm
            services/java/vertx/jvm
            services/java/pekko/jvm
          )
          build_modules=( "${SERVICE_MODULES[@]}" utils/orchestrator )

          echo "Building ${#build_modules[@]} JVM module(s):"
          printf '  • %s\n' "${build_modules[@]}"

          # ── Phase 1: Compile (module quality skipped for reliable CodeQL extraction) ──
          for mod_dir in "${build_modules[@]}"; do
            echo "::group::Compiling $mod_dir"
            if [[ "$mod_dir" == "utils/orchestrator" ]]; then
              mvn -f "$mod_dir/pom.xml" compile -DskipTests -B -q -P!quality
            else
              mvn -f "$mod_dir/pom.xml" compile -DskipTests -B -q \
                -Dcheckstyle.skip=true
            fi
            echo "::endgroup::"
          done

          # ── Phase 2: Java quality validation (non-blocking) ──
          # Violations are logged as workflow warnings. A JSON summary is
          # written for the quality-report generator, and the aggregate
          # result is captured so a later step can fail the job *after*
          # SARIF upload.
          java_quality_failed=0
          modules_failed=0
          build_warnings=()
          for mod_dir in "${build_modules[@]}"; do
            if [[ "$mod_dir" == "utils/orchestrator" ]]; then
              echo "::group::Maven quality $mod_dir"
              quality_cmd=(mvn -f "$mod_dir/pom.xml" -DskipTests verify -B)
              warning_message="Maven quality checks failed in $mod_dir"
            else
              echo "::group::Checkstyle $mod_dir"
              quality_cmd=(mvn -f "$mod_dir/pom.xml" checkstyle:check -B)
              warning_message="Checkstyle violations found in $mod_dir"
            fi

            if ! "${quality_cmd[@]}"; then
              echo "::warning::$warning_message"
              java_quality_failed=1
              modules_failed=$((modules_failed + 1))
              build_warnings+=("$warning_message")
            fi
            echo "::endgroup::"
          done
          echo "java_quality_failed=$java_quality_failed" >> "$GITHUB_OUTPUT"

          # Write build-warnings JSON for the quality report generator.
          # jq is pre-installed on GitHub-hosted runners and handles all
          # JSON escaping automatically.
          jq -n \
            --argjson checked "${#build_modules[@]}" \
            --argjson failed "$modules_failed" \
            --args '{modulesChecked: $checked, modulesFailed: $failed, warnings: $ARGS.positional}' \
            -- "${build_warnings[@]+"${build_warnings[@]}"}" > codeql-build-warnings.json
      # Go has multiple independent modules under services/go/ with no
      # root-level go.mod, so autobuild cannot discover them.  Build each
      # module explicitly so CodeQL extracts all Go source correctly.
      - name: Build Go modules
        if: matrix.language == 'go'
        shell: bash
        run: |
          for mod_dir in services/go/enhanced services/go/simple; do
            echo "::group::Building $mod_dir"
            pushd "$mod_dir" > /dev/null
            go build ./...
            popd > /dev/null
            echo "::endgroup::"
          done

      - name: Perform CodeQL Analysis
        if: always() && !cancelled() && steps.codeql-init.outcome == 'success'
        uses: ./.github/actions/codeql-action
        with:
          phase: analyze
          category: "/language:${{ matrix.language }}"
          output: codeql-results

      # Upload SARIF as a reusable artifact so the report job and the
      # Pages workflow can build a hosted HTML summary.
      - name: Upload SARIF artifact
        if: always() && !cancelled()
        uses: ./.github/actions/upload-artifact
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results/*.sarif
          retention-days: 30
          if-no-files-found: warn

      # Upload build-warning details so the report job can surface
      # Java quality violations in the hosted HTML quality page.
      - name: Upload build warnings
        if: always() && !cancelled() && matrix.language == 'java-kotlin'
        uses: ./.github/actions/upload-artifact
        with:
          name: codeql-build-warnings
          path: codeql-build-warnings.json
          retention-days: 30
          if-no-files-found: warn

      # ── Deferred Java quality gate ──
      # Placed after SARIF upload so Java quality violations fail the job
      # without preventing CodeQL report generation.
      - name: Fail on Java quality violations
        if: always() && !cancelled() && steps.build-java.outputs.java_quality_failed == '1'
        run: |
          echo "::error::Java quality violations were found in one or more Java modules (see the 'Build Java modules' step for details)."
          exit 1

  # ------------------------------------------------------------------
  # Combine per-language SARIF files into a single HTML quality report
  # that the Pages workflow publishes under /quality/codeql/.
  # ------------------------------------------------------------------
  report:
    permissions:
      contents: read
    name: Generate report
    needs: analyze
    if: always() && !cancelled()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all SARIF artifacts
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          pattern: codeql-sarif-*
          path: .codeql-sarif
          merge-multiple: false

      # Optional when Java compilation fails before writing the summary.
      # Pattern downloads allow zero matches without an error annotation;
      # merging preserves the generator's existing input path.
      - name: Download build warnings
        continue-on-error: true
        uses: ./.github/actions/download-artifact
        with:
          pattern: codeql-build-warnings
          path: .codeql-build-warnings
          merge-multiple: true

      - name: Set up Node.js
        uses: ./.github/actions/setup-node

      - name: Validate CodeQL workflow contract
        run: node --test scripts/pages/codeql-workflow.test.mjs

      - name: Generate HTML report
        run: node scripts/pages/generate-codeql-report.mjs

      - name: Upload quality report
        if: always() && !cancelled()
        uses: ./.github/actions/upload-artifact
        with:
          name: quality-report-codeql
          path: codeql-quality-report/
          retention-days: 30
          if-no-files-found: warn
