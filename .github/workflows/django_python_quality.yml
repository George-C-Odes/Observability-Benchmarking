name: Django Python Quality

on:
  merge_group:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/workflow-scope/**'
      - 'scripts/workflow-scope*.mjs'
      - 'scripts/changed-paths*.mjs'
      - 'services/python/django/**'
      - '.github/workflows/django_python_quality.yml'
      - '.github/actions/setup-python/**'
      - '.github/actions/install-python-dependencies/**'
      - '.github/requirements/**'
      - '.github/actions/upload-artifact/**'
      - 'scripts/*qodana*'
  push:
    branches:
      - main
    paths:
      - '.github/actions/workflow-scope/**'
      - 'scripts/workflow-scope*.mjs'
      - 'scripts/changed-paths*.mjs'
      - 'services/python/django/**'
      - '.github/workflows/django_python_quality.yml'
      - '.github/actions/setup-python/**'
      - '.github/actions/install-python-dependencies/**'
      - '.github/requirements/**'
      - '.github/actions/upload-artifact/**'
      - 'scripts/*qodana*'
  schedule:
    # Weekly scan — Monday at 06:30 UTC (staggered after Next.js at 06:15).
    - cron: '30 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  common:
    name: Django common checks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
      - name: Select merge group scope
        id: scope
        uses: ./.github/actions/workflow-scope
        with:
          workflow: django_python_quality.yml

      - name: Set up Python
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-python
        with:
          cache: pip
          cache-dependency-path: |
            .github/requirements/pip.in
            .github/requirements/pip.txt
            .github/requirements/python-ci.txt
            services/python/django/gunicorn/WSGI/requirements-dev.txt
            services/python/django/gunicorn/ASGI/requirements-dev.txt

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        id: dependencies
        uses: ./.github/actions/install-python-dependencies
        with:
          # These files both select Ruff; pip installs their shared pin once.
          # Include both so diverging pins fail instead of silently selecting one.
          requirements: |
            services/python/django/gunicorn/WSGI/requirements-dev.txt
            services/python/django/gunicorn/ASGI/requirements-dev.txt

      - name: Print Ruff version
        if: steps.scope.outputs.run == 'true'
        run: python -m ruff --version

      # Ruff discovers each tree's own pyproject.toml, retaining its import roots
      # and reviewed file exceptions. It also rejects invalid Python syntax.
      - name: Lint Django sources
        if: steps.scope.outputs.run == 'true'
        run: python -m ruff check services/python/django/gunicorn/common services/python/django/gunicorn/WSGI services/python/django/gunicorn/ASGI

      - name: Check Django formatting
        if: (!cancelled() && steps.dependencies.outcome == 'success') && steps.scope.outputs.run == 'true'
        run: python -m ruff format --check services/python/django/gunicorn/common services/python/django/gunicorn/WSGI services/python/django/gunicorn/ASGI

      # Framework Version Consistency owns sync_build_locks.py --check.
      - name: Test Docker dependency lock projection
        if: (!cancelled() && steps.dependencies.outcome == 'success') && steps.scope.outputs.run == 'true'
        run: python -m unittest discover -s services/python/django/gunicorn -p test_sync_build_locks.py -v

      - name: Test Qodana helpers
        if: (!cancelled() && steps.dependencies.outcome == 'success') && steps.scope.outputs.run == 'true'
        run: python -m unittest discover -s scripts -p test_qodana_python.py -v

      - name: Lint CI helpers
        if: (!cancelled() && steps.dependencies.outcome == 'success') && steps.scope.outputs.run == 'true'
        run: python -m ruff check --config services/python/django/gunicorn/common/pyproject.toml services/python/django/gunicorn/*.py scripts/run-qodana-python.py scripts/qodana-python-report.py scripts/test_qodana_python.py

      - name: Check CI helper formatting
        if: (!cancelled() && steps.dependencies.outcome == 'success') && steps.scope.outputs.run == 'true'
        run: python -m ruff format --check --config services/python/django/gunicorn/common/pyproject.toml services/python/django/gunicorn/*.py scripts/run-qodana-python.py scripts/qodana-python-report.py scripts/test_qodana_python.py

  qodana:
    name: Qodana Python (Django)
    # Collect semantic diagnostics even when common lint checks fail.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
          # Full history is used only for the merge-group scope comparison.

      - name: Select merge group scope
        id: scope
        uses: ./.github/actions/workflow-scope
        with:
          workflow: django_python_quality.yml

      - name: Set results directory
        if: steps.scope.outputs.run == 'true'
        run: echo "RESULTS_DIR=$RUNNER_TEMP/qodana-python/results" >> "$GITHUB_ENV"

      - name: Set up Python
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-python

      - name: Qodana Python Community Scan
        if: steps.scope.outputs.run == 'true'
        run: python scripts/run-qodana-python.py --results-dir "$RESULTS_DIR"

      - name: Verify inspection coverage and publish summary
        if: (always() && !cancelled()) && steps.scope.outputs.run == 'true'
        run: python scripts/qodana-python-report.py "$RESULTS_DIR" >> "$GITHUB_STEP_SUMMARY"

      # Explicit upload of the HTML report directory so the Pages workflow
      # can download and host it alongside the JVM and Next.js reports.
      - name: Upload Qodana HTML report
        if: (always() && !cancelled()) && steps.scope.outputs.run == 'true'
        uses: ./.github/actions/upload-artifact
        with:
          name: qodana-report-django-python
          path: ${{ runner.temp }}/qodana-python/results/report/
          retention-days: 30
          if-no-files-found: error

      - name: Upload Qodana diagnostics
        if: (always() && !cancelled()) && steps.scope.outputs.run == 'true'
        uses: ./.github/actions/upload-artifact
        with:
          name: qodana-diagnostics-django-python
          path: |
            ${{ runner.temp }}/qodana-python/results/scan.log
            ${{ runner.temp }}/qodana-python/results/log/
            ${{ runner.temp }}/qodana-python/results/projectStructure/
            ${{ runner.temp }}/qodana-python/results/qodana.sarif.json
            ${{ runner.temp }}/qodana-python/results/inspection-summary.*
          retention-days: 30
          if-no-files-found: warn
