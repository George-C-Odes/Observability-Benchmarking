name: pmd

env:
  # TODO(node24-migration): Remove once GitHub's default action runtime is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'services/java/**'
      - 'utils/orchestrator/**'
      - '.github/workflows/pmd.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'services/java/**'
      - 'utils/orchestrator/**'
      - '.github/workflows/pmd.yml'
  workflow_dispatch:
  schedule:
    - cron: '29 23 * * 6'

permissions:
  contents: read

jobs:
  pmd-code-scan:
    name: PMD Code Scan
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run PMD
        id: pmd
        uses: pmd/pmd-github-action@d9c1f3c5940cbf5923f1354e83fa858b4496ebaa # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          rulesets: 'rulesets/java/quickstart.xml'
          sourcePath: 'services/java'
          analyzeModifiedFilesOnly: false

      - name: Upload SARIF file
        if: always() && hashFiles('pmd-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: pmd-report.sarif
