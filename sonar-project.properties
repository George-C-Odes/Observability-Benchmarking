# CI additions to the shared settings in .sonarcloud.properties.
# scripts/coverage/sonar-coverage.mjs combines both files with validated report paths.
sonar.projectKey=George-C-Odes_Observability-Benchmarking
sonar.organization=george-c-odes
sonar.sources=.
sonar.java.source=25

# Coverage only. Keep the excluded files available for static analysis.
# The two native OpenTelemetry shims delegate to the same implementation. Spring's
# launchers delegate to Spring Boot, Micronaut's launcher also installs a logging bridge,
# and Helidon MP's JAX-RS application declares the resource root. Keep this list aligned
# with the shared exclusions in codecov.yml.
sonar.coverage.exclusions=\
  docs/index.html,\
  services/java/spring/native/netty/src/main/java/io/opentelemetry/api/internal/InstrumentationUtil.java,\
  services/java/spring/native/tomcat/src/main/java/io/opentelemetry/api/internal/InstrumentationUtil.java,\
