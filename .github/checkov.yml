# Shared by both framework jobs. Keep source Dockerfiles and .github in scope.
# All remaining checks fail on findings; these two exceptions are repository policy.
output-file-path: checkov-results
skip-download: true
skip-check:
  # Healthchecks are not required for benchmark images; keep their runtime unchanged.
  - CKV_DOCKER_2
  # Checkov does not resolve whole-image ARGs. Workflow Quality validates resolved
  # image defaults instead (scripts/dockerfile-policy.test.mjs).
  - CKV_DOCKER_7
skip-path:
  - '(^|/)(node_modules|vendor|target|build|dist|\.next|\.venv|venv|_site|apm_modules)(/|$)'
  - '(^|/)\.git(/|$)'
  - '(^|/)checkov-results(/|$)'
