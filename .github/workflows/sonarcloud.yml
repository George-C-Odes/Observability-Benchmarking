name: SonarCloud analysis

env:
  # TODO(node24-migration): Remove once GitHub's default action runtime is Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Shallow clones must be disabled for SonarCloud Git blame/history

      - name: Check SONAR_TOKEN secret
        if: "${{ secrets.SONAR_TOKEN == '' }}"
        run: |
          echo "::warning::SONAR_TOKEN secret is not configured in GitHub repository secrets. SonarCloud analysis will be skipped."
          echo "To enable SonarCloud analysis:"
          echo "  1. Sign in to https://sonarcloud.io"
          echo "  2. Import this repository (or add to your SonarCloud organization)"
          echo "  3. Generate a token at https://sonarcloud.io/account/security/"
          echo "  4. Add the secret to GitHub: Settings -> Secrets and variables -> Actions -> 'SONAR_TOKEN'"

      - name: Analyze with SonarCloud
        if: "${{ secrets.SONAR_TOKEN != '' }}"
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'george-c-odes' }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'George-C-Odes_Observability-Benchmarking' }}
          projectBaseDir: .
