name: Workflow Quality

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Workflow policy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: ./.github/actions/setup-node
      - name: Install pinned report-script validators
        run: npm ci --prefix scripts/quality --ignore-scripts --no-audit --no-fund
      - name: Install pinned Pages test dependencies
        run: npm ci --prefix scripts/pages --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript helper quality
        run: |
          npm run check --prefix scripts/quality
          npm test --prefix scripts/quality
      - name: Set up Python
        uses: ./.github/actions/setup-python
      - name: Install pinned workflow validators
        run: |
          bash scripts/ci/install-workflow-tools.sh
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements/workflow-lint.txt
      - name: Validate workflow expressions and embedded shell
        # actionlint 1.7.12 predates this officially supported hosted image.
        # Filter only this exact label diagnostic; retain all other errors.
        run: actionlint -ignore 'label "ubuntu-26\.04" is unknown\.'
      - name: Check standalone workflow shell
        run: shellcheck scripts/ci/install-workflow-tools.sh .github/actions/install-python-dependencies/install.sh
      - name: Audit workflow security
        run: zizmor --offline --min-severity medium .github
      - name: Test workflow and publication contracts
        run: node --test scripts/ci/github-actions.test.mjs scripts/ci/workflow-policy.test.mjs scripts/ci/dockerfile-policy.test.mjs scripts/ci/workflow-scope.test.mjs scripts/coverage/sonar-coverage.test.mjs scripts/scanners/qodana-project.test.mjs scripts/scanners/qodana-scopes.test.mjs scripts/pages/*.test.mjs scripts/capture-check.test.mjs scripts/scanners/snyk-scan.test.mjs scripts/scanners/snyk-report.test.mjs

  apm:
    name: APM package
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      APM_NO_SCRIPTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read and check the APM pin
        id: apm-pin
        shell: bash
        run: |
          version="$(cat scripts/apm-version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error file=scripts/apm-version.txt::Expected an exact stable APM version (X.Y.Z).'
            exit 1
          fi
          if ! grep -xFq "apm_version: $version" my-agent/apm.lock.yaml; then
            echo '::error file=my-agent/apm.lock.yaml::CLI version differs from the pin. Run python scripts/upgrade-apm.py and commit the generated lockfile.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install pinned APM CLI
        uses: microsoft/apm-action@64544310be26812256300543071bfbaa8bc93aad # v1.12.0
        with:
          setup-only: 'true'
          apm-version: ${{ steps.apm-pin.outputs.version }}
      - name: Validate the agent package
        working-directory: my-agent
        shell: bash
        run: |
          apm --version
          apm install --frozen
          apm compile --validate
          apm audit --ci --no-policy
          apm pack --dry-run
          git diff --exit-code -- apm.lock.yaml
      - name: Test the local upgrade script
        run: python3 -m unittest discover -s scripts -p test_upgrade_apm.py
