# Tempo 3.1.1: one process, local storage, no Kafka.
target: all
multitenancy_enabled: false

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  # Per-span logging can amplify overload; monitor tempo_discarded_spans_total instead.
  log_discarded_spans:
    enabled: false
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Search and TraceQL metrics leave the newest 30s out to avoid partial results.
query_frontend:
  query_end_cutoff: 30s
  search:
    query_backend_after: 15m
  metrics:
    query_backend_after: 15m

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095

storage:
  trace:
    backend: local
    block:
      version: vParquet5
    blocklist_poll: 30s
    blocklist_poll_stale_tenant_index: 2m
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

live_store:
  wal:
    path: /var/tempo/live-store/traces
  # Drain eligible traces every second to keep the high-RPS live buffer moving.
  flush_check_period: 1s
  # Bound the live-trace payload buffer above the default 250 MB backpressure threshold.
  # This is not a process memory limit; allow headroom for decoding, blocks and queries.
  max_live_traces_bytes: 536870912 # 512 MiB
  # Keep blocks at 50 MiB; four workers complete WAL blocks in parallel.
  max_block_bytes: 52428800 # 50 MiB
  max_block_duration: 30s
  complete_block_concurrency: 4
  # Must cover the 15m backend query boundary plus block-list polling delay.
  complete_block_timeout: 20m

backend_scheduler:
  local_work_path: /var/tempo/scheduler

backend_worker:
  backend_scheduler_addr: 127.0.0.1:9095
  compaction:
    compacted_block_retention: 1h

# TraceQL metrics use live-store/backend blocks. Alloy already produces span metrics;
# enabling Tempo's span-metrics/service-graphs here would add duplicate processing.
overrides:
  defaults:
    compaction:
      block_retention: 168h # 7d
    ingestion:
      rate_strategy: local # One distributor; no cluster-wide rate-limit coordination.
      rate_limit_bytes: 200000000 # Preserve the existing 200 MB/s allowance.
      burst_size_bytes: 400000000
      # 10,000 live traces is too restrictive for high-RPS runs. The byte guard above
      # still applies backpressure; this does not disable trace-size protection.
      max_traces_per_user: 0

usage_report:
  reporting_enabled: false
