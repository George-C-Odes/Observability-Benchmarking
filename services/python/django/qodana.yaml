#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

# Python-specific Qodana configuration for Django services.
#
# Mount Django as the project root and the shared Python CI requirements and
# installer read-only under /opt/python-ci. Shared CI files stay outside the
# project-opening/indexing stage; the workflow and local commands use the same mounts.

profile:
  name: qodana.recommended

linter: jetbrains/qodana-python-community:2026.2

# ---------------------------------------------------------------------------
# Bootstrap: install dependencies so Qodana can resolve imports.
#
# Without this, every import from django, opentelemetry, gunicorn, cachetools,
# and the local obbench-django-common package (imported as obbench_django_common)
# is unresolved, producing false positives that do not appear in the IDE
# (where the venv is configured).
#
# Preserve the analysis-only omission of Pyroscope packages. All selected
# third-party packages and local build tools must match the shared hash lock
# and have wheels available for the analyzer's Python interpreter.
#
# PIP_IGNORE_REQUIRES_PYTHON is required because the Qodana Python Community
# container may use an older Python version than the project declares
# requires-python >= 3.13.  The packages are only needed for import
# resolution and type stubs, not for execution.
# ---------------------------------------------------------------------------
bootstrap: |
  set -e
  bootstrap_dir=$(mktemp -d /tmp/qodana-python.XXXXXX)
  trap 'rm -rf "$bootstrap_dir"' EXIT
  cp -R /data/project/gunicorn/common "$bootstrap_dir/common"
  python3 - "$bootstrap_dir" <<'PY'
  from pathlib import Path
  import sys

  destination = Path(sys.argv[1])
  for module in ("WSGI", "ASGI"):
      source = Path("/data/project/gunicorn") / module / "requirements.txt"
      lines = source.read_text(encoding="utf-8").splitlines()
      filtered = [line for line in lines if "pyroscope" not in line.lower()]
      (destination / f"{module}.txt").write_text("\n".join(filtered) + "\n", encoding="utf-8")
  PY
  REQUIREMENTS=$(printf '%s\n' "$bootstrap_dir/WSGI.txt" "$bootstrap_dir/ASGI.txt" /opt/python-ci/requirements/qodana.in)
  export REQUIREMENTS
  export LOCAL_PROJECT="$bootstrap_dir/common"
  export EDITABLE=false
  export PYTHON_COMMAND=python3
  export PYTHON_CI_REQUIREMENTS_DIR=/opt/python-ci/requirements
  export PIP_IGNORE_REQUIRES_PYTHON=1
  export PIP_DISABLE_PIP_VERSION_CHECK=1
  bash /opt/python-ci/installer/install.sh

# ---------------------------------------------------------------------------
# Exclude paths that are not application source code.
#
# Paths are relative to this isolated project root (--project-dir).
# Specific non-Python config/build files
# (Dockerfiles, .dockerignore) are excluded from general inspections
# (spelling, encoding) that could produce noise outside the IDE's scope.
# ---------------------------------------------------------------------------
exclude:
  - name: All
    paths:
      - gunicorn/WSGI/Dockerfile
      - gunicorn/ASGI/Dockerfile
      - .dockerignore
      - gunicorn/common/build
      - gunicorn/common/*.egg-info

# Quality gate — matches the JVM config in the root qodana.yaml so the
# Python codebase is held to the same standard.
failureConditions:
  severityThresholds:
    critical: 0
    high: 0
    moderate: 0
