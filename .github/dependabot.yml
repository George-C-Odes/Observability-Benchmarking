# Renovate owns routine version updates; Dependabot retains security updates.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0 # Security updates use a separate limit.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"

  # Ruby / Jekyll (docs site)
  - package-ecosystem: bundler
    directory: /docs
    open-pull-requests-limit: 0 # Security updates use a separate limit.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: "docs"

  # Python / Django services
  - package-ecosystem: pip
    directory: /services/python/django/gunicorn/WSGI
    open-pull-requests-limit: 0 # Security updates use a separate limit.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(python)"

  - package-ecosystem: pip
    directory: /services/python/django/gunicorn/ASGI
    open-pull-requests-limit: 0 # Security updates use a separate limit.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(python)"

  # Node.js / Next.js dashboard
  - package-ecosystem: npm
    directory: /utils/nextjs-dash
    open-pull-requests-limit: 0 # Security updates use a separate limit.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(nextjs-dash)"

  # Go / Enhanced service
  - package-ecosystem: gomod
    directory: /services/go/enhanced
    open-pull-requests-limit: 0 # Security updates use a separate limit.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(go-enhanced)"

  # Go / Simple service
  - package-ecosystem: gomod
    directory: /services/go/simple
    open-pull-requests-limit: 0 # Security updates use a separate limit.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(go-simple)"

  # Go CI tools (scanner and its transitive build dependencies)
  - package-ecosystem: gomod
    directory: /.github/go-tools
    open-pull-requests-limit: 0 # Security updates use a separate limit.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(go-tools)"
