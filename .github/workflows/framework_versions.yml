name: Framework Version Consistency

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Validate shared GitHub actions
        run: node --test scripts/github-actions.test.mjs

      - name: Test coverage summary helpers
        run: python -m unittest discover -s scripts -p test_coverage_summary.py -v

      - name: Test version synchronization and Renovate routing
        run: node --test scripts/sync-*.test.mjs scripts/render-readmes.test.mjs scripts/renovate-framework-sync.test.mjs

      - name: Check framework version consistency
        run: |
          node scripts/sync-framework-versions.mjs --check
          python services/python/django/gunicorn/sync_build_locks.py --check
